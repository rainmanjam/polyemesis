<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Same three icons the website serves, and the same files: the app is the
         other place this product is seen in a tab, and it had only the SVG.
         The .ico is listed first because a browser takes the last rel="icon"
         whose type it supports, so SVG-capable ones never fetch it -- it is
         what answers the clients that ask for /favicon.ico regardless (Safari
         bookmarks, Windows pinned sites), which until now got the SPA's
         index.html with a 200 and showed a blank.
         The apple-touch-icon is full-bleed square on purpose; Apple applies its
         own squircle mask, and rounding it here shows the theme's corners
         inside Apple's. See web/src/layouts/Base.astro, which says the same. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Paint the shell colour before the bundle loads, so a slow first load
         does not flash white in a dark room. -->
    <meta name="theme-color" content="#0f1115" />
    <!-- THE THEME, BEFORE FIRST PAINT. The console is light, dark or follows the
         system (see src/lib/theme.ts); this sets <html data-theme> from the
         remembered choice or prefers-color-scheme, synchronously, so neither
         theme ever flashes the other. Dark above is the default for every page
         it does not run on: the public player and the OBS overlay are never
         themed. An EXTERNAL file, not an inline script, because the server's
         Content-Security-Policy has no 'unsafe-inline' for scripts and this is
         not worth loosening it for. It must come after the two metas it
         updates, and must NOT be async, deferred or a module: any of those
         runs it after the first paint, which is the flash it exists to stop. -->
    <script src="/theme-init.js"></script>
    <!-- The page colour before the stylesheet arrives. It is the canvas
         (<html>), not the body: an overlay is served with its own inline
         transparent background, which beats this rule, so an OBS browser source
         still paints nothing. Hexes are --surface in each theme; held to the
         tokens by src/lib/palette-contrast.test.ts. -->
    <style>
      html { background-color: #0f1115; }
      html[data-theme="light"] { background-color: #f1f3f7; }
    </style>
    <!-- The two faces the console renders in, discovered here rather than four
         round trips later. The @font-face rules live in src/index.css, which is
         inside the bundle: without these the browser cannot know a font is
         needed until it has fetched the module graph, parsed the stylesheet and
         laid out the first text — and every operator sees the fallback face for
         that whole window. web/src/layouts/Base.astro carries the same three
         lines for the same reason, and its comment records the measurement: the
         one face that was NOT preloaded there began loading 592ms after its
         siblings.
         No extra bytes; both files are fetched either way. crossorigin is
         required even same-origin, because font requests are made in CORS mode
         and a preload whose mode does not match is silently fetched twice. -->
    <link rel="preload" href="/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
    <title>polyemesis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
