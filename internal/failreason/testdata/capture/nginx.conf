# nginx-rtmp standing in for a platform ingest that checks the stream key.
#
# on_publish is how nginx-rtmp asks "may this key publish?": a 2xx admits it and
# anything else drops the connection, which is what Twitch, Kick and most
# platform ingests do with a key they do not recognise. Only keys beginning
# "good" are admitted.
worker_processes 1;
events { worker_connections 64; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
            record off;
            # GET, so the key arrives as ?name= and the http block below can
            # read it as $arg_name; the default POST puts it in a body that
            # nginx's rewrite phase cannot see.
            notify_method get;
            on_publish http://127.0.0.1:8080/auth;
        }
    }
}

http {
    server {
        listen 8080;
        location /auth {
            if ($arg_name ~ ^good) { return 200; }
            return 403;
        }
    }
    # Icecast stand-ins. An audio destination publishes with an HTTP PUT, so
    # the ingest's answer is an HTTP status: 401 is a source password the server
    # refused, 503 is a server that is up and not taking sources yet.
    server {
        listen 8000;
        location / { return 401; }
    }
    server {
        listen 8001;
        location / { return 503; }
    }
}
