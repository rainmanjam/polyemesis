# SonarCloud, as a CI-BASED analysis rather than the automatic one.
#
# WHY THIS FILE EXISTS AT ALL. SonarCloud has two modes, and this project was on
# the wrong one. Automatic Analysis needs no workflow -- it watches the repo and
# scans on push, which is why there was no Sonar step here -- but it IGNORES the
# project's own configuration. That is not a guess:
#
#   - sonar-project.properties records that sonar.issue.ignore.multicriteria was
#     added for go:S5542, did not take effect, and the gate stayed red. The
#     driver was changed instead.
#   - sonar.cpd.exclusions was later set to scripts/** through the project
#     settings UI, which is the other place the documentation says to put it.
#     Verified project-scoped through the API, with a pattern the documentation
#     confirms (`a/**` and `a/**/*` are equivalent; `**` matches ZERO or more
#     directory segments, so scripts/** does cover scripts/x.go). A real commit
#     was then analysed -- the density moved 11.4% -> 11.3% purely because that
#     commit's comment lengthened the denominator -- and all ten files under
#     scripts/ still reported their 744 duplicated lines.
#
# Two settings, two mechanisms, same outcome. Under CI-based analysis they bind,
# which is the whole reason for this file.
#
# IT ALSO BUYS COVERAGE. SonarSource documents that Go coverage is not supported
# under automatic analysis at all, so the Go coverage of this project has never
# reached SonarCloud. Wiring it is a follow-up rather than part of this change:
# the coverage profile has to come from a run with FFmpeg present, and repeating
# ci.yml's FFmpeg install here to produce one would double a fifteen-minute job
# for a number. The honest sequence is to make the analysis CI-based first, see
# it work, then feed it a profile from the job that already earns one.
#
# THE TWO THINGS THIS FILE CANNOT DO FOR ITSELF, both one-time and both manual:
#
#   1. A SONAR_TOKEN repository secret, from SonarCloud > My Account > Security.
#   2. Automatic Analysis turned OFF, at Administration > Analysis Method.
#
# They conflict: with Automatic Analysis still on, a CI scan is refused rather
# than merged, so this is a swap and not an addition. The gate below means the
# order does not matter and nothing goes red in between -- with no token this
# job explains itself and succeeds, exactly as pages.yml does when the
# Cloudflare secrets are absent.
name: sonar

on:
  push:
    branches: [main]
  pull_request:

# One analysis per branch. A superseded push has nothing to say about code that
# has already been replaced.
concurrency:
  group: sonar-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # A ceiling, because GitHub's default is SIX HOURS and this was the only job
    # in the repo without one. It builds the UI and web coverage reports and then
    # waits on somebody else's scanner, so a hang here is an outage on a service
    # this repo does not run. Twenty is roughly three times the observed run.
    timeout-minutes: 20
    steps:
      - name: Is a token configured?
        id: gate
        env:
          # Through env, never interpolated into the script body -- the same
          # reasoning as pages.yml: GitHub masks secrets in logs either way,
          # and what env buys is that the value is never part of a command line
          # that a `set -x` or a crash dump could print.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is set; running a CI-based analysis."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sonar analysis skipped::SONAR_TOKEN is not set on this repository, so this job stops here rather than failing. Add the secret and turn Automatic Analysis off under Administration > Analysis Method to switch modes -- see the comment at the top of .github/workflows/sonar.yml."
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # REQUIRED, not tidiness. The scanner reads git history to decide what
          # is new code, and the quality gate this project runs is new-code-only
          # -- new_reliability_rating, new_security_rating,
          # new_maintainability_rating, new_duplicated_lines_density and
          # new_security_hotspots_reviewed. A shallow clone leaves it guessing
          # which lines are new, and the gate is then measuring something else.
          fetch-depth: 0

      # COVERAGE, WITHOUT WHICH THE GATE MEASURES NOTHING AND FAILS ANYWAY.
      #
      # The comment above enumerates the conditions this project's gate was
      # believed to carry, and new_coverage is not among them. It is: the first
      # PR analysed after the swap failed on
      #
      #     ERROR  new_coverage  actual=0.0  LT  80
      #
      # 0.0 is not a measurement, it is the absence of one. Nothing here was
      # producing a Go coverage profile and nothing was pointing the scanner at
      # a report, so Sonar was told nothing and recorded a zero, on a repository
      # whose test suite is the largest thing in it. A gate reading that number
      # either blocks every change or teaches everybody to ignore it, and both
      # are worse than having no gate.
      #
      # WITHOUT -race, deliberately. The race detector costs this suite roughly
      # six times its runtime -- internal/api alone measured 702s under it
      # against 116s without -- and it detects nothing that a coverage profile
      # records. The race run happens in ci.yml, where it belongs.
      #
      # A failure here does NOT fail the job. A coverage profile that could not
      # be produced should leave the analysis to run without it, exactly as it
      # did before this step existed, rather than turning a reporting gap into a
      # red build for a reason nobody can act on.
      - name: Set up Go
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go coverage for the scanner
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: go test -coverprofile=coverage.out -covermode=count ./... || true

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # THE UI'S COVERAGE, WHICH SONAR MEASURED AS ZERO AND WHICH IS NOT ZERO.
      #
      # Same defect as the Go side and a smaller correction: several modules
      # here are fully covered by vitest -- viewerCount.ts and stream-health.ts
      # are both at 100% -- and Sonar was told nothing, so it counted every line
      # of them against the gate.
      #
      # WHAT THIS DOES NOT CLAIM. Overall vitest coverage of ui/src is about
      # 4%, and that number is honest rather than alarming: this UI is exercised
      # by the Playwright suite in ui/e2e, which drives the real container and
      # which Sonar cannot see. Dashboard.tsx reads 0% here and is one of the
      # most heavily exercised files in the browser suite. So this step raises
      # the numbers it can legitimately raise and leaves the rest visibly
      # unmeasured, rather than reporting e2e as unit coverage.
      #
      # continue-on-error for the reason the Go step has it: a report that
      # could not be produced must leave the analysis running, not turn a
      # reporting gap into a red build.
      - name: UI coverage for the scanner
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ui
        # --ignore-scripts: a CI job holding a SONAR_TOKEN must not run arbitrary
        # postinstall scripts from the dependency tree. That is the standard
        # supply-chain hardening, and Sonar flagged its absence here as a MAJOR
        # vulnerability against this very file -- correctly, since this job runs
        # on a token-bearing runner.
        #
        # VERIFIED RATHER THAN ASSUMED SAFE: installing with --ignore-scripts and
        # then running the coverage suite passes 210/210 in this tree, so nothing
        # vitest needs is produced by a lifecycle hook. If a future dependency
        # does need one, this step fails visibly rather than silently reporting
        # less coverage -- which is the failure mode worth guarding.
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run coverage || true

      # web/ is the marketing and documentation site. Only its two
      # markdown-pipeline modules are unit-tested, deliberately -- the harness
      # for the rest is scripts/check-build.mjs against a real build, which
      # Sonar cannot see and which is not being replaced. Without this step
      # those two modules read as 0% new coverage, which is how a green site
      # with a well-tested plugin fails a quality gate.
      #
      # --ignore-scripts and continue-on-error for the same two reasons as the
      # step above: a token-bearing runner must not execute postinstall scripts,
      # and a report that could not be produced must leave the analysis running
      # rather than turn a reporting gap into a red build.
      - name: Web coverage for the scanner
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run coverage || true

      # THE VERSION, WITHOUT WHICH THE GATE ON main EVALUATES NOTHING.
      #
      # See the long comment on sonar.projectVersion in sonar-project.properties:
      # "Sonar way" is entirely new-code conditions, SonarCloud's default new-code
      # definition is "previous version", and this project had never sent one --
      # so main had no baseline, no new code, no conditions, and a gate that read
      # NONE on five consecutive analyses.
      #
      # `git describe --tags --always` is the same string the Makefile stamps into
      # the binaries, so a version here means the same thing it means everywhere
      # else in this repository. It needs the tags, which is why the checkout
      # above fetches full history -- it already did, for the new-code diff.
      - name: Version for the scanner
        if: steps.gate.outputs.ready == 'true'
        id: ver
        run: echo "v=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        if: steps.gate.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ steps.ver.outputs.v }}

      # WHICH CONDITION FAILED -- because the scanner will not say.
      #
      # Its entire failure message is a verdict and a link:
      #
      #     ERROR QUALITY GATE STATUS: FAILED - View details on https://sonarcloud.io/...
      #
      # main's gate has now been red on every CI analysis since the swap away
      # from Automatic Analysis -- fd043cc3, e505af76, f8eb5755, 549b4fc7, four
      # for four -- and nobody reading those logs could say which condition it
      # was, because the only place it is rendered is a browser. The runs before
      # the swap read "success" for a different reason again: SONAR_TOKEN was not
      # set, so the job took its own no-op path. A green history that means "did
      # not run" and a red one that will not say why are the same defect from
      # opposite sides.
      #
      # This cannot be answered from outside CI. The project is public, but
      # api/qualitygates/project_status returns status NONE for a branch to an
      # unauthenticated caller -- and NONE renders identically to a gate that has
      # simply not been computed, so an outside reader cannot even tell the
      # difference between "failing" and "not measured". The token is here, and
      # only here, so this is where the question gets answered.
      #
      # ON EVERY ANALYSIS, not only the failing ones. A number you see only once
      # it has crossed the line is a number nobody can steer by: new_coverage at
      # 81 and new_coverage at 96 print the same nothing today, and the first
      # anyone hears of the difference is a blocked merge. Printing the whole
      # condition set every time costs one API call and makes the trend legible.
      #
      # Deliberately NOT continue-on-error: a step whose whole job is to explain
      # a failure must never be able to turn one green. If this step itself
      # breaks, the job stays red and says so.
      # WHICH CONDITIONS WERE EVALUATED -- because the scanner will not say.
      #
      # Its entire failure message is a verdict and a link:
      #
      #     ERROR QUALITY GATE STATUS: FAILED - View details on https://sonarcloud.io/...
      #
      # main's gate was red on five consecutive CI analyses and nobody reading
      # those logs could name the metric. The first run that carried this step
      # answered it in one line: `Quality gate: NONE`, with no conditions at all
      # -- and then kept answering it, through two attempted fixes, which is the
      # point of printing it. See sonar-project.properties.
      #
      # ON EVERY ANALYSIS, not only failing ones. A number you see only once it
      # has crossed the line is a number nobody can steer by: new_coverage at 81
      # and at 96 print the same nothing, and the first anyone hears of the
      # difference is a blocked merge.
      #
      # Deliberately NOT continue-on-error. The earlier version of this comment
      # said that was to stop the step turning a red job green, which was wrong
      # and is worth correcting rather than quietly deleting: the scan step has
      # already failed by then, and no later step can un-fail a job. What it
      # actually buys is that a BROKEN reporter fails visibly instead of leaving
      # a gate unread.
      - name: Which quality gate conditions were evaluated
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # THE HOST IS A CONSTANT, NOT A LOOKUP.
          #
          # This read the endpoint out of .scannerwork/report-task.txt, which the
          # scanner writes from sonar.host.url. That is a file a pull request can
          # change: setting sonar.host.url in sonar-project.properties would have
          # sent this job's Authorization header, carrying a live SONAR_TOKEN, to
          # whatever host the author chose. Fork pull requests are safe because
          # GitHub withholds secrets and this job then takes its no-op path --
          # same-repo branches are not. sonar.projectKey already pins the project
          # to one service, so there is nothing to discover here.
          SONAR_API: https://sonarcloud.io
          SONAR_PROJECT: rainmanjam_polyemesis
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP, not the workspace and not bare mktemp: the runner clears
          # it between jobs even when a SIGKILL means the trap never runs, and
          # gate.json does not belong in a git working tree.
          tmp="${RUNNER_TEMP:-/tmp}"
          umask 077
          cfg=$(mktemp "$tmp/sonar-curl.XXXXXX")
          gate=$(mktemp "$tmp/sonar-gate.XXXXXX")
          trap 'rm -f "$cfg" "$gate" "$gate.files"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$SONAR_TOKEN" > "$cfg"

          # -f so an HTTP error is a non-zero exit instead of a body that jq will
          # mis-parse later; --max-time so a hung connection cannot eat the job's
          # ceiling and report "cancelled", naming nothing; --retry so a transient
          # 502 on a green build does not turn it red.
          api() {
            curl -sSf --proto '=https' --tlsv1.2 --max-time 30 \
              --retry 3 --retry-all-errors --retry-delay 5 \
              -K "$cfg" "$1" -o "$2"
          }

          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            # The scan never submitted anything, so the scan step is already red
            # and there is no verdict in existence to report. Exiting 0 here adds
            # no second failure for one cause; it does not mask anything.
            echo "::warning title=No scanner report::$report does not exist, so the scan died before it submitted an analysis. The failure above is the scanner, not the gate."
            exit 0
          fi

          task_id=$(sed -n 's/^ceTaskId=//p' "$report")
          if [ -z "$task_id" ]; then
            echo "::error title=No ceTaskId::$report exists but names no ceTaskId, so the analysis cannot be located."
            exit 1
          fi

          # The scanner already waited for the gate (sonar.qualitygate.wait), so
          # the task is normally terminal before this runs. The loop is for the
          # case where it is not; it is short because a long one only delays a
          # failure nobody can act on.
          analysis=""
          for _ in $(seq 1 12); do
            if ! api "$SONAR_API/api/ce/task?id=$task_id" "$gate"; then
              echo "::error title=Gate unreadable::the SonarCloud API refused the request for task $task_id. This is an auth, quota or availability failure -- NOT a slow analysis."
              exit 1
            fi
            status=$(jq -r '.task.status // ""' "$gate")
            case "$status" in
              SUCCESS) analysis=$(jq -r '.task.analysisId // ""' "$gate"); break ;;
              FAILED|CANCELED)
                echo "::error title=Analysis $status::SonarCloud's background task ended $status, so no gate was ever computed."
                exit 1 ;;
              "")
                echo "::error title=Unreadable task status::the API answered for task $task_id without a status field."
                exit 1 ;;
            esac
            sleep 5
          done
          if [ -z "$analysis" ]; then
            echo "::error title=Analysis never finished::the background task was still running after 60s, so the gate could not be read."
            exit 1
          fi

          if ! api "$SONAR_API/api/qualitygates/project_status?analysisId=$analysis" "$gate"; then
            echo "::error title=Gate unreadable::the SonarCloud API refused the quality gate request for analysis $analysis."
            exit 1
          fi

          verdict=$(jq -r '.projectStatus.status // "NONE"' "$gate")
          echo "Quality gate: $verdict"
          echo
          # `?` on the iterator: a NONE verdict carries no conditions, and this
          # step must report that rather than die on a null.
          jq -r '.projectStatus.conditions[]?
                 | "\(.status)\t\(.metricKey)\tactual=\(.actualValue)\t\(.comparator // "") \(.errorThreshold)"' "$gate" \
            | sort | column -t -s "$(printf '\t')"
          jq -r '.projectStatus.conditions[]? | select(.status=="ERROR")
                 | "::error title=Quality gate: \(.metricKey)::\(.metricKey) is \(.actualValue), and the gate requires \(.comparator // "" | ascii_downcase) \(.errorThreshold)."' "$gate"

          # AND THEN FAIL ON IT. ::error annotations do not fail a step, so
          # without this the step printed "Quality gate: ERROR" and exited 0 --
          # a reporter for a gate, that did not gate. Today the job is red anyway
          # because sonar.qualitygate.wait makes the scan step red; this is the
          # half that does not depend on that setting still being there.
          #
          # NONE is a failure too, and it is the one main actually hits: a gate
          # with no conditions evaluated has not passed, it has not been asked.
          # AND WHEN IT IS COVERAGE, WHICH FILES. `new_coverage is 79.3, the gate
          # requires lt 80` names the metric and not one line to go and write a
          # test for -- and the per-file numbers are withheld from an
          # unauthenticated caller, so nobody outside CI can look them up. The
          # token is here. Printing the ten worst turns a percentage into a list
          # of files, which is the difference between a number and a task.
          if jq -e '.projectStatus.conditions[]? | select(.metricKey=="new_coverage" and .status=="ERROR")' "$gate" >/dev/null; then
            if api "$SONAR_API/api/measures/component_tree?component=$SONAR_PROJECT&branch=$BRANCH&metricKeys=new_uncovered_lines,new_lines_to_cover&qualifiers=FIL&ps=100&s=metric&metricSort=new_uncovered_lines&asc=false" "$gate.files"; then
              echo
              echo "Files carrying the most uncovered new lines:"
              { printf 'uncovered\tof-new\tfile\n'
                jq -r '.components[]?
                     | (reduce (.measures[]? | select(.value != null)) as $m ({}; .[$m.metric] = $m.value)) as $v
                     | select(($v.new_uncovered_lines // "0") != "0")
                     | "\($v.new_uncovered_lines)\t\($v.new_lines_to_cover)\t\(.path)"' "$gate.files" \
                  | head -10
              } | column -t -s "$(printf '\t')"
            fi
            rm -f "$gate.files"
          fi

          if [ "$verdict" = "NONE" ]; then
            echo "::error title=Quality gate NONE::no condition was evaluated at all -- the gate did not pass, it was never asked. The branch has no new-code baseline, and that is the project's New Code definition in SonarCloud (Administration > New Code), which is a setting and not anything in this repository. See sonar-project.properties."
            exit 1
          fi
          if [ "$verdict" != "OK" ]; then
            echo "::error title=Quality gate $verdict::the gate did not pass; the failing conditions are listed above."
            exit 1
          fi

      - name: Nothing to do
        if: steps.gate.outputs.ready != 'true'
        run: echo "No SONAR_TOKEN; this job is a no-op until the swap described in this file is done."
