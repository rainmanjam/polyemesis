# Build web/ and publish it to Cloudflare Pages.
#
# WHY THIS EXISTS. #143 wants the repository's homepage field to point at
# polyemesis.com. It has stayed unset through three re-probes because the domain
# does not serve the site: nothing in this repository has ever published web/.
# `release.yml` mentions web/ exactly twice and both times it is counting
# packages for the SBOM. The site is BUILT for https://polyemesis.com —
# astro.config.mjs sets it, and Base.astro derives every canonical URL, og:url
# and schema.org url from it — and then the build output goes nowhere.
#
# THE GATE, AND WHY IT IS A STEP AND NOT A JOB-LEVEL `if`. Publishing a public
# site is the maintainer's act, not a merge's. This workflow must therefore be
# mergeable and green BEFORE the credential exists, and must start publishing the
# moment it does, with no second edit. `secrets` is not available in a job-level
# `if:` — the contexts there are github, needs, vars and inputs — so the gate is
# a first step that reads the secrets through `env:` and publishes a boolean, and
# the publish step is conditioned on that boolean. Until the secret is added this
# workflow builds the site, runs its build checks, says so in a notice, and
# exits 0. It does not fail, because a red X on main for a credential nobody has
# added yet trains people to ignore red Xs.
#
# THE BUILD IS DELIBERATELY NOT GATED. web/ has had no CI of any kind: `astro
# check`, the link/fragment resolution pass and the built-CSS assertions in
# web/scripts/check-build.mjs have only ever run on someone's laptop. Running
# them here on every PR that touches web/ is worth having on its own, and it is
# what makes the ungated half of this file useful before the gate opens.
name: pages

on:
  # Pull requests build and check but never publish — see the `if` on the
  # publish step, which requires refs/heads/main as well as the credential.
  #
  # NO `paths:` FILTER HERE, AND THAT IS WHAT MAKES THIS CHECK REQUIRABLE.
  # A workflow-level `paths:` filter does not skip the job, it skips the whole
  # workflow -- no run, no check, no name. Branch protection cannot require a
  # name that is absent on most pull requests: it would wait on it forever with
  # nothing red to point at, which is precisely the failure
  # internal/testenv/required_checks_test.go was written after (#650, #656,
  # #659, all unmergeable at once on 2026-09-02, forty of forty green).
  #
  # So the filter moved INSIDE, to the `site-scope` job below, where a pull
  # request that touches nothing this workflow covers is answered by a shim job
  # carrying the same name rather than by silence. ci.yml's
  # container-not-applicable is the same pattern. The cost is one ~20s job on
  # pull requests that do not
  # touch the site; what it buys is that `astro check`, the link/fragment
  # resolution pass and the built-CSS assertions in web/scripts/check-build.mjs
  # can gate merge instead of being advisory.
  pull_request:
  # docs/** (RB-5, #499): content.config.ts loads with `base: "../docs"` and
  # astro.config.mjs maps every `/docs/${slug}` route straight onto
  # `../docs/${file}` — this build renders the REPO'S docs/, not a copy under
  # web/. Without docs/** here, a push that only touches docs/ matches no
  # `paths:` filter, this workflow never runs, and a docs-only correction
  # merges to main and never redeploys. That is exactly the failure mode
  # this issue is named for: the fix for the false 0.7.0 claim would itself
  # have been unable to reach the published site.
  #
  # The filter stays on `push:`, where the question is different: a push to main
  # that changes nothing the site renders has nothing to redeploy, and there is
  # no check to answer.
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "README.md"
      - "integrations/streamdeck/README.md"
      - "integrations/streamdeck/package.json"
      - "integrations/streamdeck/com.polyemesis.streamdeck.sdPlugin/manifest.json"
      - "integrations/streamdeck/com.polyemesis.streamdeck.sdPlugin/imgs/**"
      - "integrations/streamdeck/src/**"
      - "integrations/streamdeck/scripts/keyPalette.mjs"
      - "internal/routing/profile.go"
      - "internal/ffmpeg/detect.go"
      - "go.mod"
      - "ui/package.json"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  # A RELEASE REDEPLOYS THE SITE (#559). Tagging used to rebuild nothing:
  # `branches` and `paths` are AND-ed, so a tag push matched no filter here at
  # all, and Footer.astro's `git describe --tags` plus every "latest release"
  # claim on the site stayed at whatever the last web/- or docs/-touching commit
  # had produced. CHANGELOG.md was not in the paths list either, so the document
  # the advisories point at could not reach the site (it is listed now). That is #499's "the
  # correction cannot reach the site", one mechanism narrower.
  #
  # workflow_run RATHER THAN `tags:` ON THE PUSH ABOVE, because a second `push:`
  # key is not a thing and `paths` would apply to the tag too -- the filter that
  # is right for main is exactly the one that made a tag match nothing. This
  # fires when release completes, runs on main (where the new tag now is, so
  # `git describe` resolves to it), and rebuilds the published site with no
  # paths filter in the way.
  workflow_run:
    workflows: [release]
    types: [completed]
  # The escape hatch for the first deploy: after adding the secrets the
  # maintainer needs a run without waiting for a commit that touches web/.
  workflow_dispatch:

# cancel-in-progress is FALSE, unlike ci.yml. There the superseded run is a test
# suite nobody is waiting on. Here it is an upload to a live site, and killing
# one mid-flight to start another trades a deterministic order for a race
# between two deployments over which is promoted last.
concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The `paths:` filter that used to sit on `pull_request:`, moved somewhere it
  # can be answered. A plain git diff rather than a third-party action, and
  # anything that is not a pull request runs everything, because a push, a
  # release and a dispatch have no diff to reason about.
  #
  # NOT NAMED `changes`, AND NOT THE DOCUMENTATION GATE. internal/testenv/
  # docsgate_test.go watches the job named `changes` and the expression
  # `needs.changes.outputs.code`, and its rule is deliberately flat: that gate
  # is read from a step's `if:` and never from a job's, because a skipped MATRIX
  # job never expands its matrix and its per-leg required contexts are then
  # absent rather than skipped (#351, and #349 unmergeable at fifteen green).
  #
  # This is a different gate with a different hazard. It decides whether the
  # site needs rebuilding at all, it gates a job with NO matrix, and the
  # complement is answered by a sibling carrying the same name -- which is the
  # shape ci.yml already uses for container-suites -> container /
  # container-not-applicable, not the shape docsgate_test is about. Naming it
  # `changes` would have made this file claim membership of a rule whose
  # prescription it cannot follow: pagesdeploy_test.go requires the Build step
  # to carry no `if:` at all, which is the opposite of "gate every step".
  site-scope:
    name: which site changes
    # ONLY A RELEASE THAT PUBLISHED REDEPLOYS THE SITE (poka-yoke audit
    # 2026-11-04). workflow_run fires on EVERY completed release run -- a
    # failed tag run, the weekly scheduled rehearsal, a dry-run dispatch -- and
    # each of those redeployed the site, which then announced a version whose
    # binaries were never published. A release publishes only on a tag push
    # that succeeded, so that is the one workflow_run this lets through. A
    # dispatch with dry_run: false also publishes, but the workflow_run payload
    # does not carry the input, so it cannot be told from a rehearsal here: run
    # this workflow by hand (workflow_dispatch below) after one of those.
    # Every job needs this one, so skipping it skips the whole workflow_run.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.detect.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: building"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "changed files:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'
          # The globs the `pull_request:` filter used to carry, plus the files
          # web/scripts/check-build.mjs reads from outside web/ and docs/ (the
          # root README, CHANGELOG.md (web/src/lib/release.ts reads it for the hero's version and date), go.mod, ui/package.json, the routing and ffmpeg constants, the
          # Stream Deck plugin's three Node-floor files, and the plugin's key-layout code
          # (src/, scripts/keyPalette.mjs and its key images) that the homepage's Stream Deck
          # section imports); the
          # push: paths above list the same ones. Note
          # docs/** is load-bearing and not a courtesy -- astro.config.mjs maps
          # /docs/${slug} onto the repository's own docs/, so a docs-only change
          # IS a site change. See the comment on the triggers above.
          if grep -qE '^(web/|docs/|README\.md$|go\.mod$|ui/package\.json$|CHANGELOG\.md$|internal/routing/profile\.go$|internal/ffmpeg/detect\.go$|integrations/streamdeck/(README\.md|package\.json|scripts/keyPalette\.mjs|src/.*|com\.polyemesis\.streamdeck\.sdPlugin/(manifest\.json|imgs/.*))$|\.github/workflows/pages\.yml$)' <<<"$CHANGED"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "touches the site: building"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "touches nothing the site renders: not applicable"
          fi

  # THE SHIM. Carries the same name as `deploy` so that the required context is
  # ALWAYS answered -- green when the pull request cannot affect the site, and
  # never silent. Without it, requiring this check would hang every pull request
  # that does not touch web/ or docs/.
  deploy-not-applicable:
    name: build web/ and publish to Cloudflare Pages
    permissions:
      contents: read
    needs: site-scope
    if: needs.site-scope.outputs.site != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Not applicable to this pull request
        run: |
          echo "::notice title=Site not built::This pull request changes nothing under web/ or docs/, so the site was not rebuilt. It builds in full on main and on every pull request that touches it. See the changes job for the rule that decided this."
          echo "pages: not applicable to this pull request."

  deploy:
    name: build web/ and publish to Cloudflare Pages
    needs: site-scope
    if: needs.site-scope.outputs.site == 'true'
    runs-on: ubuntu-latest
    # Step limits below: apt mirror 3 + Chromium 8 + layout check 3 + home check 15 = 29 minutes at most.
    # The steps without a limit of their own (npm ci ~3, unit tests ~1, build ~1, publish ~1, setup ~1)
    # add ~7 typically, so every step can run to its limit and the job still ends by its own limit: 29 + 7 = 36 <= 40.
    timeout-minutes: 40
    defaults:
      run:
        # Every path in this job is relative to web/, which is what makes
        # wrangler.toml's `pages_build_output_dir = "./dist"` resolve to
        # web/dist. internal/testenv/pagesdeploy_test.go asserts that.
        working-directory: web
    steps:
      # TAGS, because Footer.astro runs `git describe --tags --abbrev=0` at build
      # time and OMITS the version line entirely when that fails -- which a
      # shallow, tagless checkout guarantees. The footer has therefore been
      # silently versionless on every deploy, which is the failure that
      # component's own comment describes ("a shallow clone, a tarball, no
      # tags") without anything ever making it not happen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Same major as the ui job in ci.yml and as the Dockerfiles' node tag.
          node-version: 24
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Restore npm cache (read-only off main)
        if: github.ref != 'refs/heads/main'
        uses: ./.github/actions/restore-npm-cache
        with:
          lockfile: web/package-lock.json

      # FIRST, so the log says whether this run can publish before it spends any
      # time building. A reader who came here asking "why is the site still not
      # up" gets the answer in the first step rather than the last.
      - name: Is the deploy credential present?
        id: gate
        env:
          # Through env, never interpolated into the script body. GitHub masks
          # secrets in logs either way; what env buys is that the value is never
          # part of the command line a `set -x` or a crash dump could print.
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are both set."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site built but not published::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set on this repository, so this run stops after the build. Adding both secrets is what turns this workflow into a deploy — see docs/SITE-DEPLOY.md."
          fi

      # --ignore-scripts, matching ci.yml's ui job. Verified that wrangler still
      # runs under it: its platform binaries arrive as optionalDependencies, not
      # through an install script.
      - name: Install
        run: npm ci --ignore-scripts

      # The markdown pipeline's own plugins, which decide per fence whether a
      # reader sees a diagram or forty lines of `flowchart TD`. check-build.mjs
      # below catches the same class of mistake -- it is what caught this
      # plugin's first version, by counting 21 <pre> against 19 Copy buttons --
      # but only after a full 38-page build, and only as a count. These localise
      # it to the predicate.
      - name: Unit tests
        run: npm test

      # NOT gated. `npm run build` is `astro check && astro build &&
      # scripts/check-build.mjs`, and the third of those is the only thing in the
      # repository that asserts about the shipped CSS and the resolvability of
      # every internal link.
      - name: Build
        run: npm run build

      # CARD ALIGNMENT IS A LAYOUT CLAIM, SO IT IS CHECKED IN A BROWSER.
      #
      # check-build.mjs reads dist/ as text and cannot see whether two cards in
      # a row end at the same height or a grid's edge lands on the column's.
      # scripts/check-layout.mjs loads every page with a card grid or a bordered
      # table in Chromium at four widths and measures it. It needs dist/, so it
      # runs after Build and is not part of `npm test` (which runs before it).
      #
      # The browser install is ci.yml's acceptance-browser recipe, and the cache
      # key is the same string, so a browser cached for that suite on main at
      # the same Playwright version is restored here too.
      - name: Playwright version
        id: playwright-version
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          [ -n "$v" ] || { echo "could not resolve playwright-core version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "playwright-core $v"

      - id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Same reason as ci.yml's step of this name: install-deps is apt, and a
      # stalling azure mirror holds apt through its full timeout per index.
      - name: Prefer a reachable apt mirror
        timeout-minutes: 3
        run: |
          sudo tee /etc/apt/apt.conf.d/99polyemesis >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF
          m=/etc/apt/apt-mirrors.txt
          if [ -f "$m" ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$m"
            [ -s "$m" ] || echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee "$m" >/dev/null
          fi

      - name: Install Chromium
        # install-deps is capped at 360 s (6 minutes) by the `timeout` below; the browser download needs ~2 more.
        timeout-minutes: 8
        run: |
          # install-deps is apt, and apt can be down on its own: on 2026-11-11
          # every *.ubuntu.com host failed DNS on the runners for over an hour
          # while everything else resolved, and that alone blocked a publish.
          # The image already carries Chrome and the libraries it links, so a
          # failed install-deps is a warning, not a stop. If a library really
          # is missing, the browser checks below fail at launch, by name.
          timeout 360 npx --no-install playwright install-deps chromium ||
            echo "::warning::playwright install-deps failed (apt unreachable?); relying on the image's libraries"
          npx --no-install playwright install chromium

      - name: Card layout (browser)
        timeout-minutes: 3
        run: npm run check:layout

      - name: Home page (browser)
        # Seventeen units of browser work plus the stability pass, software WebGL and 13 s idle windows: ~3.5
        # minutes on a many-core laptop, 604.8 s (10 minutes) measured on 2 CPUs in a container. The script's own deadline is 780 s (13 minutes), so
        # 15 lets it stop and report before the step is killed.
        timeout-minutes: 15
        run: npm run check:home

      - name: Inner pages (browser)
        # Twelve routes in six contexts (two widths, each with scripts on, scripts off and reduced motion): about
        # 4 minutes on a many-core laptop with the contexts running side by side. The script's own deadline is 780 s
        # (13 minutes), so 15 lets it stop and report before the step is killed.
        timeout-minutes: 15
        run: npm run check:inner

      - name: Publish to Cloudflare Pages
        # Both halves are load-bearing. The gate is the credential. refs/heads/
        # main is what keeps a pull_request run — including one from a fork,
        # where the secrets would be empty anyway — from publishing.
        if: steps.gate.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --no-install: run the wrangler that npm ci just installed from the
          # lockfile, with its integrity hash, rather than letting npx resolve a
          # version from the network at deploy time. Same argument release.yml
          # makes for pinning syft by SHA-256 instead of by version tag.
          #
          # No directory and no --name: both come from wrangler.toml, so there is
          # one place to change them and a test can read it.
          #
          # `wrangler deploy`, not `wrangler pages deploy`. Cloudflare no longer
          # offers Pages project creation in its dashboard -- its create flow
          # builds a Worker -- and `pages deploy` refused with `The Pages project
          # "polyemesis" does not exist` with no supported way to make one. See
          # the header of web/wrangler.toml.
          npx --no-install wrangler deploy

      - name: What is left to do
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "The site was built and checked. It was not published."
          echo "docs/SITE-DEPLOY.md lists the two secrets, the DNS records, and how to verify."
