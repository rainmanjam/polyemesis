# Automod, against a real endpoint.
#
# scripts/acceptance-automod.sh opens sockets to api.openai.com. Like the chat
# suite and the SRT probe it is deliberately not in the main CI path: a network
# dependency on somebody else's server, run on every push, is a flake generator,
# and this repo has spent enough measurement on flakes already.
#
# THE SCHEDULE IS THE POINT. This measures THEIR behaviour, and the failures it
# is built to catch happen with no commit of ours at all:
#
#   - the endpoint stops answering an unauthenticated request with a status and
#     starts failing at the transport, at which point the fail-open path this
#     package is built around is no longer being exercised by anything.
#   - the certificate chain changes or expires.
#   - the OpenAI-compatible chat-completions shape moves, and the connector's
#     response parser silently starts failing open on every message -- which
#     looks exactly like a channel with no abuse in it.
#
# None of those would be caught by a test that only ran when somebody edited
# internal/automod. Weekly, because the failure modes are slow-moving and the
# certificate check warns fourteen days out -- two runs of notice.
#
# NO CREDENTIALS ARE USED HERE. Nineteen of the twenty-one checks need none;
# step 7 skips without a key and no key is configured for this workflow.
# Nothing in this run can leak a secret because none is present.
#
# NOTHING REAL IS SENT. The two strings this suite POSTs are constants in
# scripts/acceptance_automod_driver.go. No message anybody sent leaves here.
name: automod (live endpoint)

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC. Off the hour, and off the chat suite's minute, so the
    # two do not queue behind each other: GitHub's scheduler runs everything
    # submitted on the same tick late.
    - cron: "27 6 * * 1"
  pull_request:
    paths:
      - "internal/automod/**"
      - "scripts/acceptance-automod.sh"
      - "scripts/acceptance_automod_driver.go"
      - ".github/workflows/automod-live.yml"

permissions:
  contents: read

concurrency:
  # One at a time. Two runs racing would double the unauthenticated requests to
  # the same endpoint from the same address, which is the one thing here worth
  # being careful about.
  group: automod-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automod:
    name: automod against a real endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: automod acceptance
        run: ./scripts/acceptance-automod.sh
