# The two acceptance suites that take time, on a timer.
#
# acceptance-duration.sh and acceptance-faults.sh exist because #380 named
# gaps a 75-second suite cannot see by construction: memory growth, reconnect
# churn and disk fill over half an hour, and a fault arriving into a broadcast
# that was already healthy. Neither was in any workflow. docs/TESTING.md said
# they were "run by hand", and the staging-readiness review found the last
# hand run weeks old (row 28).
#
# What that cost is on record. The first run for that review, against main on
# 2026-09-23, found both suites broken in ways only running them could show:
# the duration suite's 900s watchdog killed every DURATION_MINUTES=30 run at
# minute fifteen, and the faults suite's endpoint "fault" closed only the
# listener, which a destination already connected to it never noticed. Against
# v0.10.0 the same driver passed, because that build had not connected yet
# when the listener closed. A suite that nobody runs finds none of this.
#
# NOT IN ci.yml, and not in its required matrix. A thirty-minute broadcast on
# every pull request buys nothing a weekly one does not -- duration faults are
# slow by definition -- and a leg of ci.yml's acceptance matrix is a required
# status check. Its own workflow also keeps the rows off every pull request's
# checks list, where a job that only runs on a timer would show as "skipped".
#
# A failed scheduled run notifies the repository's watchers, which is the
# signal: changelog-freshness.yml relies on the same thing.
name: acceptance long-run

on:
  # Mondays at 07:41 UTC, off the hour and clear of ci.yml's 06:17 container
  # run, so the two do not queue for runners together.
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the duration suite broadcasts for (1-120)"
        type: string
        default: "30"

concurrency:
  group: acceptance-longrun-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  longrun:
    name: "long-run: ${{ matrix.suite }}"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Build (~3 min) + FFmpeg (cached; 8 on a cold mirror) + the suite. The
    # suite step carries its own, smaller ceiling so a hang names the step.
    timeout-minutes: 150
    strategy:
      # Both answers are wanted when both break, as in ci.yml's matrix.
      fail-fast: false
      matrix:
        suite: [acceptance-duration, acceptance-faults]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore Go cache (read-only off main)
        if: github.ref != 'refs/heads/main'
        uses: ./.github/actions/restore-go-cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json
      - name: Restore npm cache (read-only off main)
        if: github.ref != 'refs/heads/main'
        uses: ./.github/actions/restore-npm-cache
        with:
          lockfile: ui/package-lock.json

      # The same pinned 8.1 build, from the same cache key, as ci.yml's
      # acceptance job -- so a long-run failure is never "a different FFmpeg".
      - name: Install FFmpeg
        timeout-minutes: 8
        uses: ./.github/actions/install-ffmpeg
      - name: Check FFmpeg
        timeout-minutes: 8
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -version | head -1
      - run: make build

      # The minutes input reaches a shell, so it is validated here rather than
      # interpolated: through env, digits only, and bounded so the suite step's
      # ceiling below still clears it.
      - name: ./scripts/${{ matrix.suite }}.sh
        timeout-minutes: 135
        env:
          SUITE: ${{ matrix.suite }}
          MINUTES_IN: ${{ inputs.minutes || '30' }}
        run: |
          set -euo pipefail
          case "$MINUTES_IN" in ''|*[!0-9]*) echo "::error::minutes must be a whole number, got '$MINUTES_IN'"; exit 1 ;; esac
          if [ "$MINUTES_IN" -lt 1 ] || [ "$MINUTES_IN" -gt 120 ]; then
            echo "::error::minutes must be 1-120, got $MINUTES_IN"; exit 1
          fi
          # acceptance-duration.sh derives its own watchdog from this number
          # (lib-watchdog.sh's poly_watchdog_arm_for), so no POLY_WATCHDOG_SECS
          # is set for it; the faults suite keeps the library's default.
          DURATION_MINUTES="$MINUTES_IN" "./scripts/$SUITE.sh"

      - name: Upload logs
        # On failure only: a green run's logs are never read. Seven days rather
        # than ci.yml's three because this runs weekly, and a Monday failure
        # should still have its logs when someone gets to it.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.suite }}-logs
          path: |
            /tmp/polyemesis-acceptance-*/**/*.log
            /tmp/polyemesis-acceptance-*/facts.env
          if-no-files-found: ignore
          retention-days: 7
