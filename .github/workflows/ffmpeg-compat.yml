name: ffmpeg compat (latest 8.x and 9.x)

# THE FFMPEG-USING PACKAGES AGAINST THE TWO RELEASE LINES POLYEMESIS SUPPORTS.
#
# The floor is 8.0 (internal/ffmpeg MinMajorVersion). This tests exactly two
# builds, and nothing older: the newest 8.x and the newest 9.x release.
#
#   - 8.x is what the Docker image ships (Dockerfile, FFMPEG_VERSION=8.1.3-r0)
#     and what the installer's pinned static build is;
#   - 9.x is what Homebrew, Arch, Debian sid and BtbN's n9.0 builds hand to a
#     binary-mode install today, and what the image moves to once a stable
#     Alpine packages it.
#
# The 6.1 floor leg this file used to run is gone with the 6.0 floor, and so
# are its by-name skips (multitrack FLV, two audio streams in one flv, and a
# quiet-feed stop): every one of them was a 6.x limitation, and each now has to
# pass on both legs.
#
# NOT A REQUIRED CHECK, deliberately. The required set is ci.yml's 8.1 lanes,
# which decide whether a change works on what ships. This reports drift on the
# newest releases before an operator does, and a red leg here is a finding to
# read, not a merge block.
#
# Cost, measured 2026-10-29 in a linux container on the same package list:
# the slowest package (engine) takes 95-107 s and the packages run in parallel,
# so a leg is about two minutes of tests plus setup -- roughly 4-5 runner
# minutes per leg, two legs, on a matching pull request and once a week.

on:
  workflow_dispatch:
  schedule:
    # Wednesdays, 05:23 UTC: off the hour, and off the Monday suites' minutes.
    - cron: "23 5 * * 3"
  pull_request:
    paths:
      # The packages that shell out to FFmpeg or parse what it prints.
      - "internal/ffmpeg/**"
      - "internal/supervisor/**"
      - "internal/engine/**"
      - "internal/media/**"
      - "internal/meters/**"
      - "internal/clipper/**"
      - "internal/clips/**"
      - "internal/playlistmedia/**"
      - "internal/transcribe/**"
      - "internal/recording/**"
      - "internal/rtmpserver/**"
      - "internal/srtserver/**"
      - "internal/multitrack/**"
      - "internal/uploadprobe/**"
      - "internal/routing/**"
      - "go.mod"
      - "go.sum"
      # THIS FILE COUNTS, for the reason obs-multitrack.yml gives.
      - ".github/workflows/ffmpeg-compat.yml"
      - ".github/ffmpeg-pin.env"
      - ".github/actions/install-ffmpeg/**"

permissions:
  contents: read

concurrency:
  group: ffmpeg-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: "ffmpeg ${{ matrix.ffmpeg.line }}"
    runs-on: ubuntu-latest
    # About two minutes of tests and one 130 MB download. The ceiling assumes
    # the download stalls through every retry and the slowest package still
    # finishes; GitHub's default is six hours.
    timeout-minutes: 20
    strategy:
      # Both answers are wanted when both break.
      fail-fast: false
      matrix:
        ffmpeg:
          # EACH LEG IS ONE DATED BUILD, BY HASH, named in .github/ffmpeg-pin.env
          # (its tag, asset and sha256, with the month-end rule and the bump
          # steps). The action reads the leg's `line` as the pin file's series.
          # The 8.1 build is the one ci.yml and scripts/install.sh run; 9.0 is
          # only here, to catch the next major before the image moves to it.
          - line: "8.1"
          - line: "9.0"
    env:
      # A missing ffmpeg/ffprobe is a failure here, never a skip.
      POLYEMESIS_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore Go cache (read-only off main)
        if: github.ref != 'refs/heads/main'
        uses: ./.github/actions/restore-go-cache

      - name: Install FFmpeg ${{ matrix.ffmpeg.line }}
        timeout-minutes: 6
        uses: ./.github/actions/install-ffmpeg
        with:
          series: "${{ matrix.ffmpeg.line }}"
      - name: Check FFmpeg and install caption fonts
        timeout-minutes: 6
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -protocols | tr ' ' '\n' | grep -qx srt
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
          # CAPTION FALLBACK FONTS, as the shipping image and ci.yml's Linux
          # jobs have them: BtbN's libass reads the system's fontconfig, and
          # the clipper's caption tests fail on boxes where a font is missing.
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig && break
            echo "apt attempt $attempt failed"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
      - name: FFmpeg-using packages
        run: |
          set -euo pipefail
          go test -count=1 -timeout 20m \
            ./internal/ffmpeg/ ./internal/supervisor/ ./internal/engine/ \
            ./internal/media/ ./internal/meters/ ./internal/clipper/ \
            ./internal/clips/ ./internal/playlistmedia/ ./internal/transcribe/ \
            ./internal/recording/ ./internal/rtmpserver/ ./internal/srtserver/ \
            ./internal/multitrack/ ./internal/uploadprobe/ ./internal/routing/
