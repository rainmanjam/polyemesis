# Release: publish multi-architecture container images and native binaries.
#
# Triggered by pushing a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub account name
#   DOCKERHUB_TOKEN     an access token from hub.docker.com/settings/security
#                       (an access token, NOT your password: it can be scoped
#                       to read/write and revoked without changing your login)
#
# Nothing here publishes on an ordinary push. A tag is the only trigger, so
# releasing is always a deliberate act.
name: release

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the whole thing without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but push nothing"
        type: boolean
        default: true

# ONE PUBLISH PER REF AT A TIME. Delete and re-push v0.7.0 to fix a wrong
# CHANGELOG date, or press "Re-run all jobs" on a run whose images job failed,
# and two runs executed the same publish steps concurrently:
# softprops/action-gh-release UPDATES an existing release rather than refusing
# one, so both runs uploaded dist/* to the same release and the asset set could
# end up half from each. Every other workflow here already has a group --
# ci.yml, installer.yml, pages.yml, security.yml and seven more. This was the
# only one without, and it is the one that publishes.
#
# cancel-in-progress: FALSE, deliberately. Cancelling a run mid-push leaves a
# container tag without the release it belongs to, which is the exact failure
# the `needs: binaries` serialisation below was added to prevent. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Declared per job rather than once here. The two jobs need DIFFERENT things,
# and granting the union to both hands each of them a capability it never uses:
# the images job could have rewritten the repository, and the binaries job
# could have pushed a container image. Neither is a bug today; both are a
# larger blast radius than the work requires, and this workflow is the one that
# runs with a registry token and publishes what people install.

env:
  IMAGE: rainmanjam/polyemesis
  # The same images, published twice. GHCR needs no secret -- GITHUB_TOKEN is
  # already scoped to it -- so a fork gets working publishing with nothing
  # configured, and anyone who would rather not depend on Docker Hub's
  # anonymous pull limits has a second source of the identical manifest.
  #
  # Lowercase because ghcr.io rejects anything else in a path; the repository
  # name already is.
  #
  # ONE MANUAL STEP, ONCE: a package is PRIVATE the first time it is published.
  # The workflow cannot change that for you, so until somebody sets it to public
  # at Packages -> polyemesis -> Package settings -> Change visibility, a
  # `docker pull ghcr.io/rainmanjam/polyemesis` from a stranger gets denied and
  # looks exactly like a failed publish. Publishing from a workflow with
  # GITHUB_TOKEN is what links the package to this repository automatically;
  # the org.opencontainers.image.source label in each Dockerfile is what makes
  # the package page point back here.
  GHCR_IMAGE: ghcr.io/rainmanjam/polyemesis
  # Whether this run publishes anything.
  #
  # It used to be `github.event_name == 'push'` at six separate call sites,
  # while the dry_run input below was declared and READ BY NOTHING. Setting
  # dry_run=false and expecting a publish got a silent no-op: the run went
  # green, pushed nothing, and said nothing about it. One expression, consulted
  # everywhere, and the input now means what it says.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}

jobs:
  # RB-1: a tag push shares nothing with ci.yml. `needs:` only orders jobs
  # WITHIN this workflow, and ci.yml triggers on push-to-main and pull_request
  # -- a different trigger entirely, on a different SHA history. Before this
  # job, `binaries:` had no `needs:` at all: the only thing standing between a
  # red commit and a published release was someone remembering to check main
  # was green before typing `git tag`. That is rung zero -- a bad release
  # looks identical to a good one right up until someone runs the binary.
  #
  # This asks the platform directly, by commit SHA, rather than trusting
  # branch protection: even if the required-checks list drifts, or the tag
  # targets a commit that was never main's HEAD, a commit with no successful
  # ci.yml run cannot publish. FAILS CLOSED -- an API error, a rate limit, an
  # empty result all read as "not proven green" and block everything below.
  ci-gate:
    name: CI gate (fail closed)
    runs-on: ubuntu-latest
    permissions:
      # Read-only: this job asks about other runs, it never touches them.
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - name: Require a successful ci.yml run for this commit before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A rehearsal (workflow_dispatch, dry_run=true) builds and publishes
          # nothing -- see PUBLISH above -- so there is nothing here for this
          # gate to protect. Gating it anyway would block rehearsing a branch
          # that never had its own green ci.yml run, which is exactly the case
          # the rehearsal exists to serve.
          if [ "${PUBLISH}" != "true" ]; then
            echo "Dry run: nothing will be published, skipping the CI gate."
            exit 0
          fi

          echo "Looking for a successful ci.yml run against ${SHA}..."
          runs_json=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20") || {
            echo "::error::Could not reach the Actions API to check CI status for ${SHA}. Refusing to publish an unverified release."
            exit 1
          }

          # AS MAIN, ON A PUSH. A bare "some green ci.yml run exists" was
          # narrower than its name: ci.yml's suite picker keeps the full
          # acceptance set only for `schedule` or REF = refs/heads/main, and
          # every other ref falls through to `suites=[]`. The container matrix
          # is then empty, those jobs are skipped, and the run's conclusion is
          # still `success`. So a commit whose only ci.yml run was a manual
          # workflow_dispatch on a hotfix branch satisfied this gate having
          # never run the acceptance suites at all.
          successes=$(echo "${runs_json}" | jq '[.workflow_runs[]? | select(.status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length')

          if [ "${successes:-0}" -lt 1 ]; then
            echo "::error::No successful ci.yml run found for commit ${SHA} from a push to main. A version tag must point at a commit that passed CI *as main* -- a workflow_dispatch or branch run skips the acceptance matrix and still reports success. Merge to main and let CI run there, then tag. Refusing to publish."
            exit 1
          fi

          echo "Found ${successes} successful ci.yml run(s) for ${SHA}. Proceeding."

  # THE INSTALLER WAS NOT ON THE RELEASE'S CRITICAL PATH (#559). installer.yml
  # runs on push/pull_request filtered to scripts/install.sh,
  # scripts/acceptance-install.sh and its own file -- and a tag push matches no
  # `paths` filter at all -- so the release published without the installer
  # suite having run against the released commit. ci-gate requires ci.yml only.
  # install.sh is what every operator uses.
  #
  # RUN HERE RATHER THAN LOOKED FOR ELSEWHERE. Asking the API for a green
  # installer.yml run against this SHA (the shape ci-gate uses) would refuse
  # almost every release, because that workflow's paths filter means most
  # release commits legitimately never triggered it -- a gate that is wrong most
  # of the time gets bypassed. So this runs the parts of it that are properties
  # of the SCRIPT rather than of a distro: the parse, the argument validator,
  # and the acceptance suite that drives the generated update.sh and
  # uninstall.sh against temporary directories. Seconds, no container matrix,
  # and it fails the release closed.
  #
  # NOT COVERED HERE, said plainly: the per-distribution preflight and the real
  # install/uninstall/interrupt job in installer.yml. Those need containers and
  # a runner that can be dirtied, and they are the reason that workflow exists.
  # This is the half that can be made a release gate, not a replacement for it.
  installer-gate:
    name: installer suite (fail closed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh parses and its argument validator refuses bad input
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/acceptance-install.sh
          for bad in "--mode wat" "--tls wat" "--http-port abc" "--http-port 70000" "--srt-port 0" "--rtmp-port 70000" "--unknown"; do
            # shellcheck disable=SC2086
            if bash scripts/install.sh $bad >/dev/null 2>&1; then
              echo "::error::install.sh accepted '${bad}'. The argument validator is what stands between an operator's typo and a half-configured host."
              exit 1
            fi
            echo "refused: ${bad}"
          done

      - name: Installer acceptance
        run: ./scripts/acceptance-install.sh
  # RB-5 (#499): CHANGELOG.md claimed 0.7.0 shipped -- a dated `## [0.7.0] —
  # 2026-08-21` heading -- while no v0.7.0 tag existed anywhere: not in git,
  # not on GitHub Releases, not on Docker Hub. Every install path therefore
  # delivered 0.6.0, which lacks the seal-at-rest fix the heading described.
  # An operator reading the changelog had no way to know the tag and the
  # document had drifted apart.
  #
  # This closes the gap the other direction from ci-gate: that job proves the
  # commit is safe to publish, this one proves the TAG BEING PUSHED is the
  # release CHANGELOG.md actually describes. Same discipline -- FAILS CLOSED.
  # An unparseable changelog, a missing dated heading, or a version mismatch
  # all refuse the publish rather than guess which one is stale.
  changelog-gate:
    name: Tag / CHANGELOG agreement (fail closed)
    runs-on: ubuntu-latest
    permissions:
      # Read-only: this job only reads CHANGELOG.md, it never writes anything.
      contents: read
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 so the TAG OBJECT itself is present, not just the commit
      # it points at. The annotated-tag check below reads the object's type, and
      # a shallow fetch can leave nothing to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the pushed tag to match CHANGELOG.md's top dated heading
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # A workflow_dispatch rehearsal runs from a BRANCH, not a tag --
          # REF_NAME is something like "docs/accuracy-pass", which was never
          # going to match a "## [x.y.z] — date" heading and isn't claiming to.
          #
          # THE PREMISE THAT USED TO BE HERE WAS FALSE. This said "nothing here
          # would be published either way (see PUBLISH)" and exited 0 -- but
          # PUBLISH is exactly what makes it false: a workflow_dispatch with
          # dry_run: false publishes for real, from a branch, with this gate
          # stepped aside. `github.ref` is then refs/heads/main, which contains
          # no hyphen, so metadata-action ENABLES :latest -- and install.sh
          # writes `image: <IMAGE>:latest` into every docker operator's compose
          # file, so the next update.sh hands them a build of an untagged main
          # that no release gate examined. One un-ticked checkbox.
          #
          # So: a non-tag run may rehearse, and may not publish. Refusing is the
          # inverted condition that turns this from a skip into a gate.
          if [ "${REF_TYPE}" != "tag" ]; then
            if [ "${PUBLISH}" = "true" ]; then
              echo "::error::Refusing to publish from ${REF_TYPE} '${REF_NAME}'. Only a version tag can publish: a branch has no CHANGELOG heading to check against, and publishing from one overwrites the :latest, :cuda and :vaapi tags every docker install tracks. Re-run with dry_run: true to rehearse, or push a v* tag to release."
              exit 1
            fi
            echo "Not a tag push (${REF_TYPE} '${REF_NAME}') and nothing will be published; nothing to compare against CHANGELOG.md."
            exit 0
          fi

          # ANNOTATED, not lightweight. A lightweight tag publishes identically
          # and leaves no tagger, no date and no message in the object, so the
          # only record of who cut a release and when is the Actions run that
          # eventually expires. v0.4.0 through v0.6.0 are all annotated; nothing
          # made that true except a human typing -a.
          tag_type="$(git cat-file -t "refs/tags/${REF_NAME}" 2>/dev/null || echo unknown)"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error::${REF_NAME} is a ${tag_type} object, not an annotated tag. A release tag must carry a tagger, a date and a message. Delete it and re-cut it: git tag -d ${REF_NAME} && git push origin :${REF_NAME} && git tag -a ${REF_NAME} -m 'release ${REF_NAME}' && git push origin ${REF_NAME}. Refusing to publish."
            exit 1
          fi

          # v0.7.0 -> 0.7.0
          tag_version="${REF_NAME#v}"

          # THE FIRST VERSION HEADING OF ANY KIND, dated or not. "## [Unreleased]"
          # carries no version and is skipped by the pattern; anything with a
          # version number is not.
          #
          # Matching only DATED headings was a hole, found by simulating this
          # gate against the real file before v0.7.0 was tagged. `## [0.7.0] —
          # unreleased` is undated, so the pattern skipped straight past it to
          # `## [0.6.0] — 2026-08-09` and answered with THAT. Two ways to be
          # wrong: pushing v0.7.0 was refused with "does not match top dated
          # heading (0.6.0)", which reads as "the changelog describes 0.6.0"
          # and sends the operator to edit the wrong entry -- and re-pushing
          # v0.6.0 was ACCEPTED, because 0.6.0's own heading answered for a
          # release that had already shipped. A gate that skips the entry it is
          # meant to be checking has an older one waiting to agree with it.
          heading=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md || true)

          if [ -z "${heading}" ]; then
            echo "::error::Could not find any '## [x.y.z]' heading in CHANGELOG.md. Refusing to publish ${REF_NAME}: an unparseable changelog cannot be verified to match the tag."
            exit 1
          fi

          heading_version=$(echo "${heading}" | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')

          if [ -z "${heading_version}" ]; then
            echo "::error::Found a heading in CHANGELOG.md but could not extract a version from it: '${heading}'. Refusing to publish ${REF_NAME}."
            exit 1
          fi

          if [ "${heading_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${REF_NAME} does not match CHANGELOG.md's top version heading (${heading_version}). Update CHANGELOG.md to describe ${tag_version}, or tag v${heading_version} instead. Refusing to publish."
            exit 1
          fi

          # DATED, not just present. The heading is written undated while the
          # release is being prepared, which is correct; it stops being correct
          # the moment a tag claims that release has shipped. Naming the exact
          # edit, because the previous message named the wrong entry entirely.
          heading_date="$(echo "${heading}" | sed -nE 's/^.*— ([0-9]{4}-[0-9]{2}-[0-9]{2})[[:space:]]*$/\1/p')"
          if [ -z "${heading_date}" ]; then
            echo "::error::CHANGELOG.md's ${heading_version} heading is not dated: '${heading}'. A tag says this release shipped, so date it before tagging -- change it to '## [${heading_version}] — $(date -u +%Y-%m-%d)' and push the tag again. Refusing to publish."
            exit 1
          fi

          # DATED TODAY, not merely dated. The check above proves the heading
          # HAS a date; it never proved the date was right, and the two come
          # apart in the ordinary case: the heading is dated while the release
          # is being prepared and the tag is held for a few days -- which is
          # literally what happened for 0.7.0, dated 2026-08-21 in #487 and
          # re-dated later. A heading dated a week ago published happily, and
          # the release notes then asserted a ship date the artefacts
          # contradict. GHSA advisories point at this document.
          #
          # UTC, and exactly today. A midnight-boundary push fails here and the
          # recovery is the same one the undated branch prints: re-date, re-tag.
          # That is a rare annoyance; a silently wrong ship date is a permanent
          # false claim.
          today="$(date -u +%Y-%m-%d)"
          if [ "${heading_date}" != "${today}" ]; then
            echo "::error::CHANGELOG.md's ${heading_version} heading is dated ${heading_date}, but this release is being published on ${today} (UTC). Change it to '## [${heading_version}] — ${today}', then delete and re-push ${REF_NAME}. Refusing to publish a release whose notes claim a ship date the artefacts contradict."
            exit 1
          fi

          echo "Tag ${REF_NAME} matches CHANGELOG.md's top version heading (${heading_version}), dated ${heading_date}, which is today."

  images:
    name: container images
    runs-on: ubuntu-latest
    # PUBLISHED LAST, BECAUSE A CONTAINER TAG IS THE ONE THING HERE THAT CANNOT
    # BE UNPUBLISHED QUIETLY. These two jobs used to run in parallel, so a
    # `binaries` failure -- a syft download, the SBOM guard, an upload -- left
    # Docker Hub and GHCR already carrying :0.7.0, :0.7 and :latest with no
    # GitHub Release, no binaries, no checksums and no SBOM behind them.
    #
    # That is worse than a half-finished release looks, because the two install
    # modes diverge: install.sh writes `image: <IMAGE>:latest` into the compose
    # file, so every docker operator running update.sh takes the new version
    # immediately, while binary installs resolve through releases/latest and
    # stay on the old one. Same tag, two populations, one of them running an
    # artefact whose SBOM never passed its guard.
    #
    # Re-pushing identical tags is idempotent, so this costs a serialised wait
    # and buys the property that a container tag never exists without the
    # release it belongs to.
    needs: binaries
    permissions:
      contents: read # checkout only; this job never writes to the repository
      packages: write # ghcr.io, via GITHUB_TOKEN
    # A ceiling, because GitHub's default is SIX HOURS. Measured over eight
    # runs at 2.8 to 6.7 minutes, and the spread is the point: three image
    # variants, built multi-arch under QEMU and pushed to two registries, so
    # every leg is either an emulated compile or a network transfer and both
    # are variable by nature.
    #
    # Forty-five, the same figure ci.yml gives its container job for
    # comparable Docker work. Generous on purpose: this is the job that
    # publishes, and a ceiling that fires part-way through leaves half a
    # release on Docker Hub and GHCR. The cost of cutting it too fine is paid
    # in tags someone has to go and delete; the cost of forty-five is a stuck
    # push held for forty-five minutes instead of six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag name goes into a Docker tag and a filename, and neither accepts a
      # slash. `v0.1.0` is fine, so a real release never notices -- but a
      # workflow_dispatch rehearsal runs from a BRANCH, and a conventional
      # branch name like `docs/accuracy-pass` produces
      # `polyemesis:docs/accuracy-pass-cuda`, which buildx refuses as an invalid
      # reference. The rehearsal was therefore impossible from any branch named
      # the way this project names branches, which is the one situation it
      # exists to serve.
      #
      # Read from the environment rather than interpolated into the script, so
      # a ref name can never be treated as shell.
      # The GPU tag lists are derived HERE rather than written as literals below,
      # for two reasons that both come from the same place: metadata-action does
      # this correctly for the default image and the GPU steps were hand-written.
      #
      #   PRERELEASE (#556). `:latest` is withheld for a tag containing a hyphen
      #   -- `enable=${{ !contains(github.ref, '-') }}` on the raw tag below --
      #   but `:cuda` and `:vaapi` were unconditional literals, so tagging
      #   v0.7.0-rc1 to rehearse a real release silently made an rc build the
      #   floating tag `docker pull rainmanjam/polyemesis:cuda` resolves. Same
      #   guard, same set.
      #
      #   NAMESPACE (#585). metadata-action's {{version}} strips the leading v,
      #   giving :0.7.0, while these steps interpolated VERSION -- GITHUB_REF_NAME
      #   with slashes replaced, i.e. v0.7.0 -- giving :v0.7.0-cuda. Two
      #   spellings of one release in one registry, so :0.7.0-cuda, the one a
      #   reader would infer from :0.7.0, did not exist.
      #
      # VERSION itself keeps the v: it is the build-arg the binary reports and
      # the tag name people cite.
      - name: Derive a ref-safe version and the GPU image tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

          # Same test metadata-action applies to :latest, applied to the same
          # question: is this ref a prerelease?
          floating=true
          case "$GITHUB_REF" in *-*) floating=false ;; esac
          echo "Floating GPU tags enabled: ${floating} (ref ${GITHUB_REF})"

          for variant in cuda vaapi; do
            # tr, not ${variant^^}: that is bash 4+, and this script is also run
            # by scripts/test-release-gates.sh on whatever bash a contributor
            # has -- macOS still ships 3.2, where it is a `bad substitution`.
            upper="$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')"
            {
              echo "TAGS_${upper}<<GPUTAGS"
              if [ "$floating" = true ]; then
                echo "${IMAGE}:${variant}"
                echo "${GHCR_IMAGE}:${variant}"
              fi
              echo "${IMAGE}:${version#v}-${variant}"
              echo "${GHCR_IMAGE}:${version#v}-${variant}"
              echo GPUTAGS
            } >> "$GITHUB_ENV"
          done

      # QEMU lets one amd64 runner produce an arm64 image. It is slower than a
      # native arm64 runner but needs no extra infrastructure.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No secret to configure: GITHUB_TOKEN is already scoped to the packages
      # of the repository that owns the workflow.
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action derives the tag set from the git ref, so v1.2.3 becomes
      # :1.2.3, :1.2 and :latest. Writing those by hand is how :latest ends up
      # pointing at a prerelease.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # The default image: Alpine + FFmpeg 8.1.2, built for both architectures
      # that Docker actually runs on. linux/amd64 covers Intel/AMD servers and
      # Windows via WSL2; linux/arm64 covers Apple Silicon, Graviton/Ampere and
      # the Raspberry Pi 4/5.
      - name: Build and push (default, multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The GPU images are linux/amd64 only, and that is not an oversight:
      # Dockerfile.vaapi's driver stack (intel-media-va-driver) is an amd64
      # story, and neither image has ever been built on a machine with a GPU
      # attached. They are published so people with the hardware can try them,
      # not because they are verified. See docs/HARDWARE.md.
      - name: Build and push (NVIDIA/NVENC)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.cuda
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          # Labels on the GPU images too. They were built without any, so both
          # published with no description, source or licence in the registry --
          # the Dockerfiles now carry their own as well, which is what a manual
          # `docker build` gets.
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TAGS_CUDA }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (Intel/AMD VA-API)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.vaapi
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TAGS_VAAPI }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub does not read the repository's README on its own: without
      # this the listing shows an empty overview, which is what a page nobody
      # scrolls past looks like. Only on a real tag, and only if it can log in.
      #
      # SCOPE: this needs a Docker Hub token with read/write/DELETE, which is a
      # wider scope than pushing an image needs. With a read/write token the
      # login succeeds, the images publish, and only this step fails -- with a
      # bare "Error: Forbidden" on the PATCH. That is what happened on v0.1.0:
      # seven tags published and the listing page stayed blank, because
      # continue-on-error below quite correctly refused to fail the release
      # over a description. If this step is red, check the token scope first.
      - name: Push the README to Docker Hub
        if: env.PUBLISH == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Self-hosted restreaming with per-destination audio routing"
          readme-filepath: ./README.md
        # Metadata is not the release. A Docker Hub API hiccup must not fail a
        # run whose images and binaries already published.
        continue-on-error: true

  binaries:
    name: native binaries
    runs-on: ubuntu-latest
    # BOTH gates, because they answer different questions and a release needs
    # both answers. ci-gate (RB-1) asks whether the tagged COMMIT passed CI;
    # changelog-gate (RB-5, #499) asks whether the TAG is the release
    # CHANGELOG.md actually describes. A green commit tagged as the wrong
    # version, and a correctly-named tag on a red commit, are both bad
    # releases, and each gate is blind to the other's failure. `images`
    # already needs `binaries`, so both publish paths are gated through here.
    needs: [ci-gate, changelog-gate, installer-gate]
    permissions:
      # Creates the GitHub Release and uploads the assets. No packages: write —
      # this job pushes no images.
      contents: write
    # A ceiling, because GitHub's default is SIX HOURS. Measured over eight
    # runs at 2.8 to 3.4 minutes and tightly clustered, because the work is
    # deterministic: cross-compile every target, scan the source tree for the
    # SBOM, checksum, upload.
    #
    # Twenty-five, matching ci.yml's cross job, which cross-compiles the same
    # targets. This is that plus the SBOM and the release upload, so the same
    # figure is already the looser of the two readings of it.
    #
    # What actually hangs here is not the compiling. It is the syft download
    # below, whose curl has no --max-time, and the release upload at the end.
    # Both are one connection to one host that can be accepted and then left
    # open.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FIRST, BEFORE ANYTHING IS BUILT OR PUSHED. A release that has already
      # uploaded assets and then discovers its notes are wrong is a release
      # somebody has to go and delete.
      #
      # WHAT THIS CATCHES. [Unreleased] sits ABOVE the version sections, so under
      # Keep a Changelog its contents are NEWER than the release below them.
      # Every PR correctly appends there and nothing folds it forward, so the gap
      # reopens after each merge -- twice on 2026-08-14 alone. The second time it
      # stranded all seven security fixes from #366 and the VOD editor from #365:
      # nine entries a tag would have omitted.
      #
      # That is not cosmetic. GHSA-7jqx points at these release notes, and the
      # fix for its worst defect -- 0.7.0's seal-at-rest migration leaving
      # plaintext keys in the WAL -- was in the section a tag would have skipped.
      # An operator following the advisory to the notes would not have found it.
      #
      # WHAT IT DOES NOT CATCH, stated because the gap is real and a guard that
      # is trusted for more than it does is worse than none. This fires when
      # entries were written and not folded. It cannot fire when they were never
      # written at all -- a merge that records nothing leaves [Unreleased] empty
      # and passes here. #400 recorded nothing and would have sailed through.
      # That second failure needs a different check, on the pull request rather
      # than the tag.
      - name: "[Unreleased] must be empty before a tag"
        run: |
          set -euo pipefail
          body=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
                 | sed '/^[[:space:]]*$/d')
          # "Nothing yet." is the deliberate empty state, not an entry.
          real=$(printf '%s\n' "$body" | sed '/^Nothing yet\.$/d' | sed '/^[[:space:]]*$/d')
          if [ -n "$real" ]; then
            echo "::error::CHANGELOG.md still has entries under [Unreleased]. Fold them"
            echo "::error::into the version being tagged before releasing -- they sit ABOVE"
            echo "::error::the version sections, so a tag cut now omits every line below."
            printf '%s\n' "$real" | head -40
            exit 1
          fi
          echo "[Unreleased] is empty; nothing would be stranded by this tag."

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Docker is never required to run polyemesis: `make release` produces a
      # self-contained binary per platform with the web UI embedded, and the
      # only external requirement is FFmpeg on the host.
      # Same slash problem as the images job: VERSION lands in the output
      # filename, so a branch named `docs/accuracy-pass` makes `make release`
      # write `dist/polyemesis-docs/accuracy-pass-linux-amd64` -- a directory,
      # which the checksum step below then chokes on with
      # "sha256sum: polyemesis-docs: Is a directory".
      - name: Cross-compile
        run: make release VERSION="${GITHUB_REF_NAME//\//-}"

      # A software bill of materials for the release, in the two formats
      # consumers actually ask for: SPDX for licence and provenance review,
      # CycloneDX for vulnerability tooling.
      #
      # Scanned from the SOURCE TREE as well as the binaries. The source tree
      # is the part that matters and the reason the scan is not pointed at
      # dist/ alone: `make release` embeds the web UI into every binary, so a
      # scan of the compiled artefact would report the Go modules and silently
      # omit every npm dependency that shipped inside it.
      #
      # Re-measured with syft 1.50.0 against the tree in the state this step
      # sees it -- after the cross-compile above, so dist/ and ui/node_modules
      # both exist. 764 packages: 523 npm, 211 Go, 27 GitHub Actions.
      #
      # Those numbers replace "437 packages -- 216 npm, 168 Go, and 52 pinned
      # GitHub Actions", which was wrong in three ways worth naming, because
      # each one is a way of misreading a scanner:
      #
      #   - 52 was never a package count; it is how many times `uses:` appears
      #     in .github/workflows. syft catalogues one package per action per
      #     workflow FILE, so the same pinned checkout across seven workflows
      #     is 7 packages. Deduped that way the real figure is 27.
      #   - "not the binaries" described an intent, not this command. syft is
      #     pointed at `.` and the cross-compile ran first, so the six binaries
      #     are in scope and their buildinfo IS the Go figure: 32 packages
      #     without dist/, 211 with it.
      #   - npm counts both lockfiles. ui/ contributes 108, because syft reads
      #     the lock and skips its 161 dev entries; web/package-lock.json marks
      #     nothing dev and contributes all 415 of its own.
      #
      # One document per format covers all three ecosystems, which no
      # per-manifest scanner produces in one file.
      #
      # The released binary, verified against a SHA-256 pinned here, rather
      # than anchore/sbom-action -- every action in this repository is
      # SHA-pinned precisely because each one is a supply-chain edge, and
      # taking on another would be the opposite of that.
      #
      # It was `go install ...@v1.50.0` first, which SonarCloud flagged
      # (githubactions:S8545) and was right to: a version tag pins syft's own
      # source and nothing else. Its transitive module graph is resolved at
      # build time, so two runs of that line a week apart can install different
      # code. A checksummed artefact is byte-exact, which is strictly stronger
      # than what the tag was buying.
      #
      # Updating the version means updating the digest with it. That is the
      # cost, and it is the same one every SHA-pinned action here already pays.
      #
      # BEFORE the checksums below, deliberately. dist/* is what SHA256SUMS
      # covers and what the release uploads, so an SBOM written afterwards
      # would ship beside a checksum file that does not describe it.
      - name: SBOM
        # Through env and quoted, never expanded inline. GITHUB_REF_NAME is a
        # tag here and therefore maintainer-controlled, but a ref name is on
        # every injection checklist for good reason, and the safe spelling
        # costs nothing.
        env:
          REF_NAME: ${{ github.ref_name }}
          SYFT_VERSION: 1.50.0
          # sha256 of syft_1.50.0_linux_amd64.tar.gz, from the release's own
          # syft_1.50.0_checksums.txt. This job is runs-on: ubuntu-latest, so
          # one platform is the whole matrix.
          SYFT_SHA256: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
        run: |
          # Unpacked into RUNNER_TEMP, not into the checkout. syft scans `.`
          # and classifies binaries as packages, so a syft binary sitting in
          # the tree would put syft into polyemesis's own bill of materials.
          tool="$RUNNER_TEMP/syft"
          mkdir -p "$tool"
          tar="$tool/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          # --proto and --proto-redir, because -L follows redirects and a
          # GitHub release URL always redirects to object storage. Without
          # them the FIRST hop is https and every hop after it is whatever the
          # server nominates, which is the one part of this download the
          # checksum below cannot defend: a plaintext hop is interceptable
          # before there is anything to verify.
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL -o "$tar" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          # Fail before extracting, never after. A tarball that does not match
          # is not a download to retry; it is a release asset that changed
          # under a version number, and unpacking it first would run the code
          # the check exists to refuse.
          echo "${SYFT_SHA256}  ${tar}" | sha256sum -c -
          tar -xzf "$tar" -C "$tool" syft
          "$tool/syft" . \
            --source-name polyemesis \
            --source-version "${REF_NAME//\//-}" \
            -o spdx-json=dist/polyemesis-sbom.spdx.json \
            -o cyclonedx-json=dist/polyemesis-sbom.cdx.json
          # A BOM that describes nothing is worse than no BOM: it parses
          # cleanly and tells a consumer this release has no dependencies.
          #
          # This used to be `packages >= 100` against a document with 437 in
          # it, and the comment above it named the failure it was catching: a
          # scan that found one manifest and missed the rest, which "would
          # halve it, not empty it". 437 halved is 218, so the check could not
          # fail on its own stated scenario -- and measurement was worse than
          # the arithmetic. Moving ui/ and web/ aside and rescanning leaves
          # 232 packages, every npm dependency gone, comfortably over 100.
          #
          # The guard is now per ecosystem plus an anchor package for each, and
          # it lives in a script so it can be run without cutting a release.
          # That is the actual defect #96 records: not that the number was
          # wrong, but that nothing could exercise it, so it stayed wrong.
          ./scripts/sbom-guard.sh \
            dist/polyemesis-sbom.spdx.json \
            dist/polyemesis-sbom.cdx.json

      # Checksums so someone can verify a download they did not build.
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # A dry run builds the SBOM and then destroys it with the runner, so the
      # rehearsal could only ever prove the step exited 0. Uploading it makes a
      # dry run answer the question people actually have -- what is IN the bill
      # of materials -- before a tag exists to attach it to.
      #
      # Only on a dry run: a real release already carries these as assets, and
      # a second copy that expires in 90 days would be the one someone links to.
      - name: Upload SBOM for inspection (dry run only)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-dry-run
          path: dist/polyemesis-sbom.*.json
          if-no-files-found: error

      # THE RELEASE BODY IS THE FIRST THING AN OPERATOR READS, and it used to be
      # `generate_release_notes: true` alone -- a list of merged PR titles and
      # nothing else. Three facts an operator needs BEFORE they upgrade were
      # therefore in no release note at all:
      #
      #   * UPGRADES ARE ONE-WAY (#531, measured). A v0.6.0 binary opens a
      #     v0.7.0 database with no warning and no refusal, and runs every
      #     destination with an EMPTY stream key -- enabled=1, publishing
      #     nothing, silently, mid-show. Nothing 0.7.0 ships can prevent that:
      #     the code that would refuse has to be in 0.6.0, which is already on
      #     the machine being rolled back to. refuseNewerSchema buys every
      #     rollback from 0.7.0 forward and cannot reach backwards. So the only
      #     place this can be said is here, before the download.
      #   * A BACKUP WITHOUT secret.key IS NOT A BACKUP (#557). 0.7.0 seals
      #     destination stream keys at rest, so polyemesis.db alone -- a
      #     COMPLETE destination backup in 0.6.0 -- silently stopped being one.
      #     The update.sh that checks for this is generated at install time, so
      #     a 0.6.0 install is running the 0.6.0 helper, which does not check;
      #     re-running install.sh first is what regenerates it.
      #   * WINDOWS SHIPS WITH KNOWN ABORTS (#584). windows/amd64 and
      #     windows/arm64 are published here, and #440 is an intermittent Go
      #     runtime abort that takes the whole process down mid-broadcast --
      #     a different failure from the recording truncation docs/INSTALL.md
      #     already names.
      #
      # generate_release_notes stays on: this is prepended to it, not instead
      # of it.
      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Before you upgrade

            **This upgrade is one-way.** Migrations run forward only. An older
            binary opens a newer database *without complaint* and then runs every
            destination with an empty stream key — enabled, live, publishing
            nothing, with no error anywhere. Rolling back is not a supported
            recovery path; restoring your backup is.

            **Back up the whole data directory, not just `polyemesis.db`.**
            Since 0.7.0 destination stream keys are sealed at rest with
            `secret.key`. A database restored *without* that file comes back with
            every destination disabled — by design, because a key that will not
            open disables its destination rather than failing open. That restore
            looks completely successful until someone goes live.

            **Re-run `install.sh` before upgrading an install older than 0.7.0.**
            `update.sh` and `uninstall.sh` are written to disk when you install,
            so an older install is running older helpers — including one whose
            backup check does not know to look for `secret.key`. Re-running the
            installer regenerates them. See
            [docs/UPGRADING.md](https://github.com/rainmanjam/polyemesis/blob/main/docs/UPGRADING.md).

            **Windows is tested, not operated.** Two known unresolved defects:
            recordings are truncated on service stop, and #440 — an intermittent
            Go runtime abort that ends the process mid-broadcast. See
            [docs/INSTALL.md](https://github.com/rainmanjam/polyemesis/blob/main/docs/INSTALL.md#windows).

            Verify your download against `SHA256SUMS`, published below.

            ---

          # A tag containing a hyphen (v1.0.0-rc1) is a prerelease, and must
          # not become the download the front page points at.
          prerelease: ${{ contains(github.ref_name, '-') }}
