# Security scanning.
#
# Separate from ci.yml because it fails for different reasons and on a different
# clock: a new CVE published against a dependency turns this red without a line
# of this repository changing, and that is the signal, not a flake. Keeping it
# out of ci.yml means a red badge here never blocks a merge on work that is
# unrelated to it, and the weekly schedule catches advisories that land between
# pushes.
name: security

on:
  # main only, for the same reason ci.yml is: a PR branch fires both `push` and
  # `pull_request`, so ["**"] ran every scan twice per commit and posted each
  # result to the PR twice over. These jobs are short enough that the duplicates
  # completed rather than cancelling, which made the waste quieter than ci.yml's
  # but no less real.
  push:
    branches: [main]
  pull_request:
  # A branch with no PR open gets no automatic scan, so run it here by hand.
  workflow_dispatch:
  schedule:
    # Monday morning, offset from ci.yml's 06:17 so the two do not contend.
    - cron: "43 6 * * 1"

concurrency:
  group: security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Go dependency vulnerabilities, filtered by reachability. govulncheck is the
  # right tool here rather than a generic SCA: it reports what your code
  # actually CALLS, so an advisory against a package you import but never reach
  # does not become a ticket nobody can action.
  govulncheck:
    runs-on: ubuntu-latest
    # A ceiling, because GitHub's default is SIX HOURS -- and this workflow
    # runs on every push and pull request, so it is the one most likely to be
    # holding a runner that something else is queued behind.
    #
    # All four jobs here get ten, and the argument is the same one four times,
    # so it is written once. Measured across 37 runs, the slowest job in this
    # file is semgrep at 48 seconds and the rest are under half a minute. None
    # of them has any work that legitimately grows: each is one fetch -- a
    # module proxy, a registry index, a release tarball, a container image --
    # followed by a scan of a tree this size. Ten is roughly twelve times the
    # slowest thing ever observed here and thirty-six times the median, which
    # leaves a cold cache and a bad network day comfortably green while still
    # bounding a fetch that never returns.
    #
    # This job in particular has two network dependencies rather than one: the
    # module proxy it builds govulncheck from, and vuln.go.dev, which it reads
    # at run time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Pinned, like the gitleaks binary and the semgrep engine below, and for
      # the reason release.yml gives for pinning syft: SonarCloud flagged
      # `go install syft@v1.50.0` under githubactions:S8545, because a version
      # alone leaves the transitive graph to be resolved at build time. `@latest`
      # is the same objection and worse -- it does not pin even the tool's own
      # source, so two runs of this line a week apart can scan with different
      # code, and a change in what the scanner reports would be indistinguishable
      # from a change in what this repository depends on.
      #
      # syft is pinned by SHA-256 over a release tarball. That is not available
      # here: golang.org/x/vuln publishes no release binaries, it is a module.
      # The Go equivalent is what a version does for a module path -- every
      # dependency resolved from that version's own go.mod and hash-checked
      # against sum.golang.org. Verified rather than assumed: the pinned build
      # is x/mod v0.38.0, x/sync v0.22.0, x/telemetry v0.0.0-20260708182218 and
      # x/tools v0.48.0, each with an h1: hash, byte-identical across two
      # resolutions from a cold module cache. That is the property S8545 asks
      # for, obtained by the mechanism this ecosystem provides for it.
      #
      # Pinning the scanner does NOT pin what it knows. Exactly the distinction
      # the semgrep job below draws between its engine and its rules: the
      # vulnerability data is read from vuln.go.dev at run time and is no part
      # of this binary. v1.6.0 was published on 2026-07-09 and already reports a
      # database newer than itself.
      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: v1.6.0
        run: |
          set -euo pipefail
          # First, and the whole argument for the pin sits in its four lines of
          # output: "Scanner: govulncheck@v1.6.0" directly above "DB updated:
          # <date>". A reader who suspects the pin has staled the scan can settle
          # it from the log instead of from this comment.
          #
          # Printed, not asserted. gitleaks a few jobs down asserts its version
          # because a download can hand back something other than what the URL
          # named; `go run pkg@vX` cannot, so an assertion there would be
          # theatre. And a floor on the database DATE would be a different
          # thing altogether -- a gate on a third party's publishing cadence,
          # on the workflow that runs for every pull request. The failure it
          # would catch is rare and the false red blocks every merge.
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -version
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # JavaScript dependencies.
  #
  # A MATRIX OVER EVERY LOCKFILE, because it used to name one directory and this
  # repository has two. web/ -- the documentation site, 342 KB of
  # package-lock.json -- was audited by nothing: not here, not by Dependabot
  # (.github/dependabot.yml listed / and /ui), not by anything. It is a static
  # site, so nothing it depends on reaches a server this project runs; what it
  # does have is a build that runs on a runner holding repository credentials,
  # which is the supply-chain path `--ignore-scripts` below exists for.
  #
  # internal/testenv/lockfile_coverage_test.go asserts this list and
  # dependabot.yml between them cover every package-lock.json in the tree, so a
  # third one cannot arrive unaudited the way the second did.
  npm-audit:
    runs-on: ubuntu-latest
    # See the note on the govulncheck job for why ten, for all four jobs here.
    # This one's single point of stall is the npm registry, during `npm ci`.
    timeout-minutes: 10
    strategy:
      # Both answers are wanted when both are red.
      fail-fast: false
      matrix:
        project: [ui, web]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # --ignore-scripts: this job never builds anything, it only needs the
      # resolved dependency tree for `npm audit`. Running install lifecycle
      # scripts would execute code from every package in that tree on a runner,
      # which is a real supply-chain path and buys nothing here.
      - run: npm ci --ignore-scripts
      # Production dependencies only. A moderate advisory in a build-time dev
      # dependency does not ship to anybody, and treating it as urgent is how a
      # team learns to pass --force.
      - run: npm audit --omit=dev --audit-level=high

  # Committed credentials, across the full history.
  #
  # A pinned binary rather than gitleaks/gitleaks-action@v2, for two reasons
  # found by running the action first:
  #
  #  1. It requires GITHUB_TOKEN on pull_request events and not on push, so the
  #     same commit passed as a push and failed as a PR. A scanner whose result
  #     depends on which event triggered it is a scanner nobody can reason about.
  #  2. It installed gitleaks 8.24.3 while this repository's allowlist was
  #     written and verified against 8.30.1. Both report "no leaks" here, so a
  #     green run would NOT have proved the allowlist behaves the same on both —
  #     and the difference that matters (`condition = "AND"`) is exactly the
  #     kind of newer syntax an older binary can ignore rather than reject.
  #
  # Pinning means CI runs the version the config was tested against. The
  # version assertion below is what makes the pin real rather than aspirational.
  gitleaks:
    runs-on: ubuntu-latest
    # See the note on the govulncheck job for why ten, for all four jobs here.
    # This one's are the release download below and the `fetch-depth: 0`
    # checkout -- the full history, which is the only thing in this file that
    # grows with the repository, and at seven to twelve seconds today it has a
    # very long way to go.
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history. A secret that was committed and then "removed"
          # in a later commit is still a secret that was published, and a
          # shallow clone cannot see it.
          fetch-depth: 0

      - name: install gitleaks (pinned)
        run: |
          # --proto '=https' matters because -L follows redirects: without it a
          # redirect to http:// would silently downgrade the transport for a
          # binary that is about to be run as a security gate.
          #
          # RETRIED VIA A FILE, NOT A PIPE. --retry restarts the transfer from the
          # beginning, so retrying a `curl | tar` re-feeds bytes into a tar that has
          # already consumed some of the stream -- a corrupt extract, reported as a
          # download failure. Landing the archive first makes the retry safe, and
          # the extract then runs once, on a file known to be complete.
          curl -sSfL --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          installed="$(gitleaks version)"
          echo "gitleaks $installed"
          if [ "$installed" != "$GITLEAKS_VERSION" ]; then
            echo "::error::expected gitleaks $GITLEAKS_VERSION, got $installed"
            exit 1
          fi

      # Prove the allowlist is narrow before trusting it to be silent.
      #
      # .gitleaks.toml allowlists six test fixtures. It uses condition = "AND"
      # so that only those exact values, in those exact files, are ignored —
      # because the default is OR, and an OR would have exempted the whole file,
      # including a real key committed to it. A test file is precisely where a
      # real key tends to get committed by accident.
      #
      # "No leaks found" cannot distinguish a correct allowlist from one that
      # silences everything. So: plant a secret in an allowlisted file and
      # require that it is still caught.
      #
      # The planted value is assembled at run time rather than written out as a
      # literal. Spelling a credential-shaped string directly in this file
      # makes THIS file a gitleaks finding — which is exactly what happened on
      # the first attempt, and it was only caught because the scan runs against
      # committed history rather than the working tree. The parts below carry
      # no keyword before the `=`, so the rule does not fire on them.
      #
      # Both invocations below are `--no-git`: they read the WORKING TREE and
      # never open the object database. That makes this step immune, by
      # construction, to the cross-branch contamination the `scan` step below
      # had to be fixed for — a commit on somebody else's branch is not in the
      # working tree, so it cannot reach either the baseline or the assertion.
      # Do not "helpfully" give these two a --log-opts; there is no log here to
      # scope.
      - name: verify the allowlist is not over-broad
        run: |
          target=internal/alerts/redact_test.go

          # A non-zero exit from gitleaks means "something was found", not
          # "the plant was found". Asserting on the exit code alone would pass
          # on any unrelated finding — the same mistake as reading "0 findings"
          # from a scan that examined 0 files. So: establish a clean baseline,
          # then assert on the specific file.
          if ! gitleaks detect --no-banner --redact --no-git \
                 --config .gitleaks.toml --report-path before.json; then
            echo "::error::the working tree already has findings; this check cannot prove anything"
            exit 1
          fi

          # The IDENTIFIER NAME is load-bearing here, not just the value. The
          # generic-api-key rule fires on a credential-shaped string that is
          # KEYWORD-ADJACENT: it is the `...Key =` to the left of the literal
          # that arms it. Measured 2026-08-10 against this repository, this
          # config and this pinned gitleaks 8.30.1, same value both times:
          #
          #   const plantedKey   = "<value>"  ->  1 finding (generic-api-key)
          #   const plantedThing = "<value>"  ->  0 findings
          #
          # So tidying this constant's name would silently convert the whole
          # step into a check that proves nothing: the plant would go
          # undetected for the plant's OWN reasons, and the resulting failure
          # would be read as "the allowlist is too broad". Keep the Key suffix.
          prefix="live_999888777"
          body="zQ1wErTyUiOpAsDfGhJkL"
          printf '\nconst plantedKey = "%s_%s"\n' "$prefix" "$body" >> "$target"

          gitleaks detect --no-banner --redact --no-git \
            --config .gitleaks.toml --report-path after.json || true
          git checkout "$target"

          python3 - "$target" <<'PY'
          import json, sys
          target = sys.argv[1]
          found = json.load(open('after.json'))
          # Both halves matter. Matching on the FILE alone would accept a
          # finding from any rule at all in that file — including some future
          # rule that fires on something else entirely — and report it as
          # proof that generic-api-key still sees through the allowlist. The
          # plant is shaped for generic-api-key specifically; that is the rule
          # that has to be the one catching it.
          hits = [f for f in found
                  if f.get('File') == target and f.get('RuleID') == 'generic-api-key']
          if not hits:
              print("::error::A secret planted in an allowlisted file was NOT detected by generic-api-key.")
              print("::error::.gitleaks.toml is too broad: it is exempting the file, not the fixtures.")
              print("::error::(or the plant lost its keyword adjacency — see the note above the printf)")
              print(f"::error::findings seen: {[(f.get('RuleID'), f.get('File')) for f in found]}")
              sys.exit(1)
          print(f"planted secret detected in {target} by generic-api-key; "
                "the allowlist is scoped to values, not files")
          PY

          # Scoped to the file this step touched. A whole-tree check would fail
          # for anything else that happened to be modified, which is a
          # confusing way to report "the plant was not cleaned up".
          git diff --quiet -- "$target" || {
            echo "::error::the planted secret was not removed from the working tree"
            exit 1
          }
          rm -f before.json after.json

      # `gitleaks detect` with no --log-opts walks `git log -p --full-history
      # --all` — ALL refs, not this branch's. Combined with the `fetch-depth: 0`
      # checkout above, that means every branch the runner has fetched is
      # reachable, and a secret-shaped test fixture on somebody ELSE'S branch
      # fails THIS pull request.
      #
      # Measured 2026-08-10: PR #173 failed with two findings, in
      # internal/engine/dest_retained_scrub_test.go and
      # internal/api/ws_policy_array_test.go — files that exist only on PR
      # #172's branch, at commit 9a0b3dc, which is not an ancestor of #173.
      # #173's own tree, own history and own merge ref were all clean under
      # this same pinned gitleaks and this same config. When #172 later rewrote
      # its history, a rerun of #173 went green without #173 changing a line.
      #
      # The diagnostic cost is the damage. The failure names files the author
      # has never opened, in a pull request that did not touch them, and the
      # only way to establish that is to reproduce the walk by hand.
      #
      # So: on a pull request, scan the commits the pull request actually adds.
      - name: scan (pull request — this branch's own commits)
        if: github.event_name == 'pull_request'
        env:
          # Via env rather than spliced inline, so the value arrives as data to
          # the shell instead of as text pasted into the script. GitHub will
          # not create a branch whose name carries shell metacharacters, so
          # this is habit rather than a live hole — but it is the habit that
          # keeps the next edit to this block safe.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # base_ref, NOT a hardcoded origin/main: this repository has
          # release/0.4.0, the `pull_request` trigger above carries no branch
          # filter, and stacked pull requests target other fix/* branches —
          # #173's own stack is where this bug surfaced.
          #
          # base_ref, and not github.event.pull_request.base.sha either.
          # base.sha is the base tip FROZEN at PR-event time, but the thing
          # actually checked out is a merge ref rebuilt against the CURRENT
          # base tip. When the base branch is being actively pushed to — the
          # normal case for a stack — base advances after the event, its new
          # commits become reachable from HEAD but not from base.sha, and
          # base.sha..HEAD re-scans the base branch's own new commits. That is
          # the same cross-blame this step exists to remove, only slower and
          # harder to spot. An explicitly fetched origin/$BASE_REF tracks the
          # tip HEAD was really merged against.
          if ! git fetch --no-tags --quiet origin \
                 "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
            echo "::error::could not fetch base branch ${BASE_REF} from origin; refusing to scan an undefined range"
            exit 1
          fi

          # Belt and braces. The fetch above is the thing that normally fails,
          # but a fetch can succeed and still leave the ref unresolvable, and
          # the failure mode this guards against is silent: a missing base ref
          # makes the range invalid, and the tempting recovery — drop
          # --log-opts — is precisely the bug being fixed here.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::base branch origin/${BASE_REF} is absent even after an explicit fetch; refusing to scan an undefined range"
            exit 1
          fi

          range="origin/${BASE_REF}..HEAD"
          count="$(git rev-list --count "$range")"
          echo "scanning $count commit(s) in $range"

          # An empty range scans zero commits and exits 0 — a green tick from a
          # scan that read nothing, which is the exact failure mode this whole
          # workflow is written against. Refuse it rather than bank it.
          if [ "$count" -eq 0 ]; then
            echo "::error::$range is empty; gitleaks would scan 0 commits and report success having read nothing"
            exit 1
          fi

          gitleaks detect --no-banner --redact --config .gitleaks.toml --log-opts "$range"

      # push / schedule / workflow_dispatch: THIS REF'S OWN FULL HISTORY.
      #
      # The old comment here rejected scoping this branch, and its argument was
      # true of exactly one candidate: `origin/main..origin/main` is empty, so
      # a RANGE would make the post-merge and scheduled scans vacuous. That is
      # correct and it is why no range appears below. It does not follow that
      # the alternative is an unscoped walk, and reading it that way is what
      # left this step cross-blaming every other branch in the repository
      # (#191).
      #
      # `HEAD` is not a range. It is this ref's whole ancestry — all of main's
      # history on a push to main or a schedule, which is the thing those two
      # runs exist to read — and it excludes commits that are not on it.
      #
      # MEASURED locally at cffd20c with the pinned gitleaks 8.30.1, on a clone
      # carrying this repository's branches:
      #
      #   gitleaks detect (no --log-opts)      869 commits, LEAKS FOUND: 2, exit 1
      #   gitleaks detect --log-opts HEAD      626 commits, no leaks,      exit 0
      #
      # Both findings are one commit on `fix/redaction-and-auth`, and
      # `git merge-base --is-ancestor` says it is NOT an ancestor of main. So
      # today a push to main or the nightly schedule fails on a secret that is
      # not on main, in a file no commit on main contains — the alarm names the
      # wrong ref, and an alarm that names the wrong ref is one people learn to
      # clear rather than read.
      #
      # AND THE SCOPING IS NOT A SILENCER, which is the half that has to be
      # shown or this is just a way of going green. Measured in a throwaway
      # clone: a secret-shaped fixture committed onto HEAD's own history is
      # still reported by the scoped form — `leaks found: 1`, exit 1 — and the
      # same clone with that commit removed exits 0.
      #
      # --full-history is deliberately absent. It was the other candidate, and
      # it makes no difference here: `--log-opts HEAD` and
      # `--log-opts "--full-history HEAD"` scanned the same 626 commits and the
      # same 16,847,688 bytes. User --log-opts REPLACES gitleaks' own defaults
      # rather than appending to them — that is what the 869→626 drop is — so
      # the flag would only re-state a default this scan does not use.
      - name: scan (push, schedule, dispatch — this ref's own full history)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml --log-opts HEAD

  # Static analysis.
  semgrep:
    runs-on: ubuntu-latest
    # See the note on the govulncheck job for why ten, for all four jobs here.
    # The slowest of the four at 29 to 48 seconds, and it has two stalls
    # available to it rather than one: pulling the pinned engine image, and
    # fetching the rules from the registry at scan time.
    timeout-minutes: 10
    container:
      # Pinned, for the same reason gitleaks is pinned a few jobs up: an
      # untagged image is :latest, so the engine that decides whether this
      # repository is clean could change between two runs of the same commit,
      # and the rule exclusions below were reasoned about against one specific
      # analyser. Leaving this floating while arguing for a pinned gitleaks in
      # the same file was simply an inconsistency.
      #
      # Only the ENGINE is pinned. The rules still come from the registry via
      # --config=r/..., so new checks continue to arrive; what is fixed is the
      # thing that parses the tree and decides what a finding is. Bump this
      # deliberately, and re-check the exclusions when you do.
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No --error here. The gate is the two steps below, in that order:
      # prove the scan happened, THEN judge what it found. --error would exit
      # before the proof step ever ran.
      #
      # Two rules are excluded, each because the finding was traced and is not
      # a vulnerability in this codebase:
      #
      #   dangerous-exec-command — 18 hits, all exec.CommandContext(bin, argv...)
      #     invocations of ffmpeg/ffprobe. Arguments travel as a []string, never
      #     through a shell, so there is no injection path. Excluded rather than
      #     suppressed per-line because the pattern is the correct one and will
      #     recur every time a new probe is added.
      #
      #   filepath-clean-misuse — 1 hit, internal/web/web.go. path.Clean is
      #     applied to a URL path before the prefix is trimmed, which is the
      #     right order; the rule matches the shape, not the bug.
      #
      #   detect-insecure-websocket — 6 hits, every one inside a COMMENT
      #     listing the URL schemes an MQTT broker may use ("mqtt://, mqtts://,
      #     ws:// or wss://"), in .go and .md files the rule should not have
      #     been applied to at all. Plain ws:// to a LAN broker is a supported,
      #     operator-chosen deployment, surfaced in the UI as exactly that.
      #
      # Anything else at ERROR severity fails the job.
      - name: semgrep
        run: |
          semgrep \
            --config=r/go \
            --config=r/javascript.react \
            --config=r/javascript.lang \
            --exclude-rule=go.lang.security.audit.dangerous-exec-command.dangerous-exec-command \
            --exclude-rule=go.lang.security.filepath-clean-misuse.filepath-clean-misuse \
            --exclude-rule=javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
            --json --output=semgrep.json \
            --exclude=node_modules --exclude=dist --exclude=ui/dist

      # The assertion this job exists to make.
      #
      # A semgrep run that fails to load its rules exits reporting zero
      # findings and zero scanned files, and "0 findings" is indistinguishable
      # from a clean pass unless somebody looks at the second number. That is
      # not hypothetical: the first scan of this repository reported TOTAL 0
      # and had examined nothing at all, because one registry config failed to
      # parse and rule loading aborted.
      #
      # A security job that can pass forever while testing nothing is worse
      # than no job, because it is also a green badge. So: prove files were
      # read before believing anything about what was in them.
      - name: assert semgrep actually scanned the tree
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('semgrep.json'))
          scanned = len(d.get('paths', {}).get('scanned', []))
          errs = d.get('errors', [])
          fatal = [e for e in errs if e.get('level') == 'error']
          warn = [e for e in errs if e.get('level') != 'error']

          print(f"semgrep scanned {scanned} files "
                f"({len(fatal)} fatal, {len(warn)} non-fatal diagnostics)")

          # Non-fatal diagnostics are printed, not failed on. One is expected:
          # semgrep's TypeScript grammar does not accept `const satisfies` in
          # ui/src/lib/types.ts and reports a partial parse of that one file.
          # Surfacing it keeps it from quietly growing into "half the tree did
          # not parse".
          for e in warn:
              print(f"::warning::semgrep: {e.get('message', e)}")

          if fatal:
              for e in fatal:
                  print(f"::error::semgrep: {e.get('message', e)}")
              print("::error::semgrep failed to run cleanly; a partial scan is not a pass")
              sys.exit(1)

          # The floor. This repository has ~255 scannable files; 50 is well
          # under that and still far above the zero a broken rule-load yields.
          if scanned < 50:
              print(f"::error::semgrep scanned {scanned} files, expected the whole tree.")
              print("::error::A zero-finding result from a zero-file scan is not a clean bill of health.")
              sys.exit(1)
          PY

      # Only now, having established that the scan was real, is it worth
      # believing what it did or did not find.
      - name: fail on high-severity findings
        run: |
          python3 - <<'PY'
          import json, sys
          results = json.load(open('semgrep.json'))['results']
          errs = [r for r in results if r['extra']['severity'] == 'ERROR']
          for r in errs:
              print(f"::error file={r['path']},line={r['start']['line']}::"
                    f"{r['check_id']}: {r['extra']['message'].splitlines()[0]}")
          print(f"{len(errs)} ERROR-severity findings, {len(results)} total")
          sys.exit(1 if errs else 0)
          PY
