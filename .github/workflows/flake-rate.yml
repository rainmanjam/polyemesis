# Measure how often an acceptance suite fails without anything changing.
#
# Issue #38 records two suites failing and then passing on rerun, on unrelated
# branches, on the same day. That is a pattern, not a rate -- and the rate is
# what any later fix has to be measured against. Without a baseline, "I fixed
# the flake" is unfalsifiable: a suite that failed 1 run in 20 will look fixed
# after any change at all.
#
# It also exists because the evidence erases itself. `gh run rerun --failed`
# OVERWRITES the job's recorded conclusion, so querying past runs for failures
# returns nothing once anyone has rerun them. The only surviving trace is
# run_attempt > 1. Anything that wants the rate has to record it at the time,
# which is what this does.
#
# Deliberately REPORT-ONLY. It does not fail on a bad rate, because nobody
# knows yet what a bad rate is -- that is the thing being measured. Baking in a
# threshold now would be asserting the answer before taking the measurement.
#
# ----------------------------------------------------------------- SCOPE
#
# ISSUE #206. WHAT THIS INSTRUMENT COULD NOT SEE, AT ANY NUMBER OF RUNS. Three
# facts about this file, each individually reasonable, combined into a blind
# spot that was structural rather than statistical:
#
#   - the suite input was refused unless it matched ^acceptance[a-z0-9-]*$
#   - it executed ./scripts/$SUITE.sh
#   - the measure job was runs-on: ubuntu-latest
#
# So it could not run `go test ./internal/...`, and it could not run on macOS or
# Windows. For a Go-test flake (#172) and for a Windows-only flake (#180) the
# detection probability was ZERO at `runs` anywhere in 1..40 -- and both of
# those are classes this repository has actually been bitten by. The flake
# discipline could not observe the class it was used to prosecute.
#
# THE SECOND EXECUTION MODE AND THE RUNNER DIMENSION NOW EXIST. The paragraph
# above described what was missing and predicted the shape of the fix -- "a
# second matrix dimension over runner OS and a second execution mode for Go
# packages" -- and that is what `gotest` and `runners` below are. A Go-test
# flake can now be repeated, on ubuntu, macOS or Windows, which makes #172 and
# #180 measurable rather than structurally invisible.
#
# The acceptance mode is unchanged and still ubuntu-only: those suites shell out
# to ./scripts/*.sh, which assume a POSIX shell and the Linux tool set. Making
# them portable is a different job from measuring how often they fail.
#
# ------------------------------------------- WHAT THE CAP OF 40 CAN RESOLVE
#
# ISSUE #206, RESOLUTION POINT 2. This paragraph used to say that the floor at
# the cap, 7.2%, "is still above the roughly 7% per-run rate #180's incident
# survey implies", and that "the instrument cannot reach that rate even at its
# own maximum". Both sentences rested on a rate INFERRED from an incident
# survey. The rates have since been MEASURED -- #94, 1824 job records over 90
# `ci` runs, cancellations excluded by conclusion -- and the measurement moves
# the answer in both directions at once. It is written out here rather than
# summarised, because "what this instrument can see" is the only question the
# reader of a green report has:
#
#   job                              failures    rate    runs needed (95%)
#   ------------------------------------------------------------------------
#   test: windows-latest                 7/72   9.72%    30   <- inside the cap
#   test: macos-latest                   3/78   3.85%    77
#   container: acceptance-browser        1/32   3.13%    95
#   go build, vet, test                  2/70   2.86%   104
#   acceptance: acceptance-failover      2/76   2.63%   113
#   test: ubuntu-latest                  2/77   2.60%   114
#   16 other jobs                       0/80+   0.00%    --
#
# ONE job in this repository sits above the 7.2% floor, and the cap already
# reaches it: `test: windows-latest` at 9.72% needs 30 repetitions and is caught
# 98.3% of the time at 40. That is the job #206 was filed about, and the cap is
# not what stands between the instrument and it.
#
# EVERY OTHER MEASURED JOB IS BELOW THE FLOOR, where a green result means "not
# measurable here" and not "not flaky". Resolving the next one down, macOS at
# 3.85%, needs 77 repetitions; the ubuntu tier at 2.60% needs 114.
#
# THE CAP IS NOT RAISED, and the reason is that raising it would not buy those
# rows. Above roughly 19 repetitions on Windows the binding constraint is not
# the cap, it is the clock -- see the arithmetic on `timeout-minutes` in
# measure-go below. A cap of 114 would be a number that looks rigorous and
# cancels at minute 60 with no report at all, which is worse than a cap of 40
# that says what it cannot see. The sub-3% tier needs N nobody here will pay
# for: 114 repetitions of a whole-tree Windows `go test` is 5.7 hours, past even
# GitHub's six-hour default, for ONE job at ONE rate. That is the honest answer
# to point 2 and it is not a bigger number.
#
# What is done instead, because it is the half that helps: the floor is printed
# NEXT TO the `runs` input below, so the operator sees it when choosing the
# value rather than in the report afterwards.
#
# The floor is poly_detectable_floor in scripts/lib-observe.sh and its inverse
# is poly_runs_for_rate, both checked by scripts/test-lib-observe.sh against the
# closed form. Every number in the table above is reproducible from them.
#
# The report also names its own scope and prints the DETECTABLE FLOOR, so a
# green result reads as "no rate above X% is present in this suite on this
# runner" rather than as "not flaky".
name: flake rate

on:
  workflow_dispatch:
    inputs:
      suites:
        # ONE suite by default, not two. Each acceptance repetition is minutes
        # and the matrix multiplies: two suites at the default five runs is ten
        # suite executions, roughly forty minutes of runner, for a dispatch
        # somebody may have fired to ask about one of them.
        #
        # The cap on `runs` is deliberately NOT lowered to save the same money.
        # At 40 the detectable floor is 7.2%, which is below the worst measured
        # job here (test: windows-latest, 9.72% over 90 ci runs). At 25 the floor
        # is 11.3% and at 20 it is 13.9% -- both ABOVE that job, so a smaller cap
        # would leave this instrument unable to resolve the only rate it can
        # currently see, while still spending runner time to say so. Cheaper and
        # useless is worse than expensive and honest.
        description: "Comma-separated suites to measure"
        type: string
        default: "acceptance-mqtt"
      # #206 POINT 2: THE FLOOR IS STATED HERE, AT THE POINT OF CHOOSING.
      # It was already printed in the step summary, which is the wrong end --
      # by then the value has been spent. The numbers are poly_detectable_floor
      # at 95% confidence, and they are what a result of zero failures actually
      # bounds the rate below. Only `test: windows-latest` (9.72%) is above the
      # floor at the cap; every other job in this repository is below it.
      runs:
        description: "Repetitions per suite (max 40). Zero failures only bounds the rate BELOW the 95% detectable floor: 5 runs=45%, 10=26%, 20=14%, 30=9.5%, 40=7.2%. Under that floor a green result means 'not measurable here', not 'not flaky'."
        type: string
        default: "5"
      gotest:
        description: "Go package and optional -run, e.g. ./internal/supervisor -run TestStop (empty = skip)"
        type: string
        default: ""
      runners:
        description: "Runner labels for the Go mode only, comma separated"
        type: string
        default: "ubuntu-latest"

# Declared per job rather than once at the top. The two jobs genuinely differ:
# plan never checks anything out, so it needs nothing at all, and saying so is
# more accurate than granting it read access it does not use.

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions: {}
    # A ceiling, because GitHub's default is SIX HOURS. One shell step that
    # splits a comma-separated list into JSON, with no checkout and no network
    # -- 2 to 6 seconds on every run. Five, matching ci.yml's container-suites,
    # which is the same shape: a job that only decides what the next job does.
    #
    # measure below already carries 120, and a fan-out job with no ceiling in
    # front of a bounded one is the wrong way round: nothing downstream of a
    # stuck plan ever starts, so the whole matrix waits on it.
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.split.outputs.suites }}
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      # Read from the environment, never interpolated into the script: the
      # input is a string a human types and must not reach the shell as code.
      - name: Split the suite list
        id: split
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          json=$(printf '%s' "$SUITES" | tr ',' '\n' | sed 's/[[:space:]]//g' \
            | grep -E '^acceptance[a-z0-9-]*$' | jq -R . | jq -sc .)
          if [ "$json" = "[]" ] || [ -z "$json" ]; then
            echo "no valid suite names in: $SUITES" >&2
            exit 1
          fi
          echo "suites=$json" >> "$GITHUB_OUTPUT"
          echo "measuring: $json"

      # ALLOW-LISTED, not sanitised. The three GitHub-hosted labels this
      # repository uses are the only accepted values, so an input that is not
      # one of them is refused rather than passed through to runs-on. A
      # self-hosted label arriving here would send a matrix leg somewhere
      # nobody intended, and `runs-on` is not a place to find out that
      # validation was approximate.
      #
      # Read from the environment for the same reason the suite list is: the
      # input is a string a human types and must never reach the shell as code.
      - name: Split the runner list
        id: runners
        env:
          RUNNERS: ${{ inputs.runners }}
        run: |
          json=$(printf '%s' "$RUNNERS" | tr ',' '\n' | sed 's/[[:space:]]//g' \
            | grep -E '^(ubuntu-latest|macos-latest|windows-latest)$' | jq -R . | jq -sc 'unique')
          if [ "$json" = "[]" ] || [ -z "$json" ]; then
            echo "no valid runner labels in: $RUNNERS" >&2
            echo "accepted: ubuntu-latest, macos-latest, windows-latest" >&2
            exit 1
          fi
          echo "runners=$json" >> "$GITHUB_OUTPUT"
          echo "go mode runners: $json"

  measure:
    name: "${{ matrix.suite }} x${{ inputs.runs }}"
    needs: plan
    runs-on: ubuntu-latest
    # Checks the repository out; nothing more.
    permissions:
      contents: read
    # Each repetition takes minutes and there are several. The default six-hour
    # ceiling would sit burning a runner if a suite hangs rather than fails.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Everything below this line was missing, and its absence made this
      # workflow measure nothing at all: the suites bail on their own preflight
      # with "build first: make build" in under a second, so the first run of
      # this job reported 10/10 failures that were entirely its own fault. A
      # measurement instrument that has never been run is not a measurement
      # instrument -- which is the same lesson issue #38 is about, arriving from
      # an unexpected direction.
      #
      # Kept in step with the acceptance job in ci.yml. If that one grows a
      # dependency, this one needs it too, or the rate measured here stops
      # describing the thing CI actually runs.
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          # lsof as well: several suites read the engine's relay port out of it
          # to measure the right socket, and they fail obscurely without it.
          # RETRIED. A mirror that is slow rather than down turns one unlucky
          # fetch into a red run and a rerun, which is #430's complaint in
          # miniature. Three attempts with a widening pause; the job ceiling
          # above still bounds the whole thing.
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends ffmpeg lsof && break
            echo "apt attempt $attempt failed"
            [ "$attempt" = 3 ] && exit 1
            sleep $(( attempt * 5 ))
          done
          ffmpeg -hide_banner -version | head -1

      # The suites run the real binary with the UI embedded, so it has to be
      # the real build rather than `go build ./cmd/...`.
      - run: make build

      - name: Run it repeatedly and record every outcome
        env:
          SUITE: ${{ matrix.suite }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          case "$SUITE" in acceptance*) ;; *) echo "refusing: $SUITE"; exit 1 ;; esac

          # A COUNT, not merely a string of digits. `''|*[!0-9]*` rejects "" and
          # "abc" and accepts "0" -- and on GNU coreutils `seq 1 0` prints
          # nothing, so the loop below ran zero times, `fail` stayed 0, and the
          # summary published "0 failed / 0 runs" from a green job. A zero-run
          # report is indistinguishable at a glance from a clean suite, which is
          # the one reading this instrument must never produce.
          #
          # (BSD seq counts DOWN for `seq 1 0` and would have run once. The
          # workflow is ubuntu-latest, so the coreutils behaviour is the one
          # that decides -- but the guard is on the input, not on which seq.)
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a whole number, got: '$RUNS'"; exit 1 ;; esac
          [ "$RUNS" -ge 1 ] || { echo "runs must be at least 1, got: '$RUNS'"; exit 1; }
          # An upper bound as well. Each repetition is minutes; the job's ceiling
          # is 120, so a typo'd "500" buys a cancelled run with no report at all.
          [ "$RUNS" -le 40 ] || { echo "runs must be 40 or fewer, got: '$RUNS'"; exit 1; }
          [ -x "./scripts/$SUITE.sh" ] || { echo "no such suite: $SUITE"; exit 1; }

          pass=0; fail=0
          : > /tmp/outcomes.txt
          for i in $(seq 1 "$RUNS"); do
            start=$(date +%s)
            if "./scripts/$SUITE.sh" > "/tmp/${SUITE}-$i.log" 2>&1; then
              rc=PASS; pass=$((pass + 1))
            else
              rc=FAIL; fail=$((fail + 1))
            fi
            printf '%s\t%s\t%ss\n' "$i" "$rc" "$(( $(date +%s) - start ))" >> /tmp/outcomes.txt
            echo "  run $i: $rc ($(( $(date +%s) - start ))s)"
            # The last line of a failing run is usually the assertion that
            # broke, which is the thing worth reading in the summary.
            if [ "$rc" = FAIL ]; then
              tail -3 "/tmp/${SUITE}-$i.log" | sed 's/^/      /'
            fi
          done

          # THE SECOND LOCK, and deliberately not a re-reading of the input.
          #
          # The validation above is one edit away from being wrong again -- it
          # already was. This counts the outcomes actually WRITTEN by the loop,
          # so any future path to zero executions (a seq that emits nothing, a
          # RUNS that survives a loosened case, a loop body that never runs)
          # stops here rather than publishing. Nothing is appended to the step
          # summary before this check: a run that measured nothing must leave no
          # report at all, because the report is what gets read as the answer.
          measured=$(grep -c . /tmp/outcomes.txt || true)
          if [ "${measured:-0}" -lt 1 ]; then
            echo "::error::no run was executed, so there is no rate to report"
            echo "::error::refusing to publish '0 failed / 0 runs' -- that reads as a clean suite"
            exit 1
          fi
          if [ "$measured" -ne "$RUNS" ] || [ "$((pass + fail))" -ne "$measured" ]; then
            echo "::error::recorded $measured outcome(s) and $((pass + fail)) tallied for $RUNS requested run(s)"
            echo "::error::the measurement is incomplete; refusing to publish a rate from it"
            exit 1
          fi

          # #206: what this run could NOT have detected. A green report is read
          # as "the suite is not flaky", and at the default of 5 runs it does
          # not support that: nothing below a per-run rate of about 45% is
          # caught with 95% confidence. Sourced rather than reimplemented so the
          # arithmetic has a test -- scripts/test-lib-observe.sh checks it
          # against the closed form p = 1 - (1-c)^(1/N).
          . ./scripts/lib-observe.sh
          floor=$(poly_detectable_floor "$measured" 95) || floor=""

          {
            echo "### $SUITE"
            echo
            echo "**$fail failed / $measured runs**, unchanged tree, same runner image."
            echo
            if [ -n "$floor" ]; then
              echo "Detectable floor at $measured runs: **${floor}%**. A per-run failure"
              echo "rate below that is caught less than 95% of the time, so a result of"
              echo "0 failures bounds the rate rather than clearing it."
            else
              echo "_The detectable floor could not be computed for $measured runs._"
            fi
            echo
            echo "Scope: \`./scripts/$SUITE.sh\` on ubuntu-latest only. THIS job says nothing"
            echo "about any other suite, any other runner, or any Go test. A Go test can now"
            echo "be measured through the \`gotest\` input, on ubuntu, macOS or Windows -- but"
            echo "that is a different job and its result is not this one. See issue #206."
            echo
            echo '| run | result | duration |'
            echo '|---|---|---|'
            awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' /tmp/outcomes.txt
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RESULT $SUITE: $fail/$measured failed"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-logs-${{ matrix.suite }}
          path: /tmp/*.log
          if-no-files-found: ignore

  # THE GO MODE. Issue #206: the acceptance mode above cannot execute a Go
  # package test and cannot leave ubuntu, so for #172 (a -race flake in a Go
  # test) and #180 (a Windows-only process-lifetime flake) its detection
  # probability was zero at every value of `runs`. Those are classes this
  # repository has been bitten by and then could not measure.
  #
  # A SEPARATE JOB RATHER THAN A MODE FLAG ON THE ONE ABOVE. The two share only
  # the loop shape: this one needs a Go toolchain and no FFmpeg, runs on three
  # operating systems, and reports per-runner. Folding them together would put
  # two `if:` ladders through every step to keep one name.
  measure-go:
    name: "go ${{ matrix.os }} x${{ inputs.runs }}"
    needs: plan
    # Skipped entirely when the input is empty, so the ordinary acceptance
    # dispatch does not pay for a matrix it did not ask for.
    if: inputs.gotest != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Lower than the acceptance job's 120: a Go package test is seconds to a
    # couple of minutes, not minutes to tens. It exists so a HUNG test reports
    # rather than sitting to GitHub's six-hour default -- which is #179 exactly.
    #
    # AND IT, NOT THE CAP OF 40, IS WHAT BOUNDS N ON WINDOWS. #206 point 2 asked
    # whether to raise the cap; this is the arithmetic that answers no. Measured
    # over the last 25 `ci` runs on main, per-step, windows-latest:
    #
    #   checkout 6s + setup-go 28s + set up job 1s  =  ~35s paid ONCE
    #   `go test -timeout 15m ./...`                =  179s median, 239s p90
    #
    # So the loop's budget is at most 3600 - 35 = 3565s, and at the whole-tree
    # median only floor(3565/179) = 19 repetitions fit. The step projects
    # against a deliberately conservative 3300s and so reports 18; the point of
    # both numbers is the same, and it is that the nominal cap of 40 is ALREADY
    # unreachable on Windows for a broad package selection. 40 is achievable
    # only if one repetition costs 89s or less (3565/40). A narrow
    # `-run` pattern is far cheaper than the whole tree and is the usual case,
    # which is why the cap is not lowered either -- the ceiling depends on what
    # is being repeated, so the job measures it at run 1 and warns, rather than
    # guessing here. Raising the cap to the 114 the sub-3% jobs need would be
    # 5.7 hours at 179s a repetition: past this ceiling, past GitHub's own.
    timeout-minutes: 60
    strategy:
      # One runner's flake must not cancel the measurement on the others. That
      # is the entire point of the dimension: the interesting result is that
      # windows differs from ubuntu, and fail-fast would delete it.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # bash on all three, so the loop is written once. GitHub's Windows images
      # ship it; the alternative is a PowerShell copy of this script that would
      # drift from the bash one the moment either is edited.
      - name: Repeat the test
        shell: bash
        env:
          GOTEST: ${{ inputs.gotest }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -uo pipefail

          # VALIDATED, NOT QUOTED. The input is a string a human types into a
          # dispatch form, and it reaches `go test` as ARGUMENTS. Read from the
          # environment so it is never interpolated into the script as code,
          # then split into exactly two fields and each checked against what it
          # is allowed to be. Anything else is refused rather than escaped:
          # there is no shell metacharacter in a package path or a -run pattern
          # that this workflow has any reason to accept.
          PKG=$(printf '%s' "$GOTEST" | awk '{print $1}')
          FLAG=$(printf '%s' "$GOTEST" | awk '{print $2}')
          PATTERN=$(printf '%s' "$GOTEST" | awk '{print $3}')
          if printf '%s' "$GOTEST" | awk 'NF>3{exit 0} {exit 1}'; then
            echo "gotest takes at most '<package> -run <pattern>', got: $GOTEST" >&2
            exit 1
          fi
          case "$PKG" in
            ./*) ;;
            *) echo "package must start with ./, got: '$PKG'" >&2; exit 1 ;;
          esac
          printf '%s' "$PKG" | grep -qE '^\./[A-Za-z0-9._/-]+$' || {
            echo "package has characters this workflow will not pass to go test: '$PKG'" >&2; exit 1; }
          ARGS=("$PKG" -count=1)
          if [ -n "$FLAG" ]; then
            [ "$FLAG" = "-run" ] || { echo "the only accepted flag is -run, got: '$FLAG'" >&2; exit 1; }
            printf '%s' "$PATTERN" | grep -qE '^[A-Za-z0-9_|/^$.()-]+$' || {
              echo "-run pattern has characters this workflow will not pass on: '$PATTERN'" >&2; exit 1; }
            # `$` and `(` are both legitimate in a -run regex -- `TestFoo$` and
            # an alternation group -- so the class above admits them, which also
            # admits the literal text `$(`. It is NOT evaluated: the value comes
            # from the environment, is never re-expanded, and reaches go test
            # inside an argument array. This refuses it anyway. The reasoning
            # that makes it safe is four steps long, and a reader should not
            # have to reconstruct it to review a workflow.
            case "$PATTERN" in
              *'$('*|*'`'*) echo "-run pattern may not contain \$( or a backtick: '$PATTERN'" >&2; exit 1 ;;
            esac
            ARGS+=(-run "$PATTERN")
          elif [ -n "$PATTERN" ]; then
            echo "a pattern was given with no -run before it: '$PATTERN'" >&2; exit 1
          fi

          # The same bounds the acceptance job applies, for the same reasons.
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a whole number, got: '$RUNS'"; exit 1 ;; esac
          [ "$RUNS" -ge 1 ] || { echo "runs must be at least 1, got: '$RUNS'"; exit 1; }
          [ "$RUNS" -le 40 ] || { echo "runs must be 40 or fewer, got: '$RUNS'"; exit 1; }

          # NO FFMPEG IS INSTALLED, AND THAT IS A LIMIT ON WHAT MAY BE MEASURED
          # HERE, not an oversight. POLYEMESIS_REQUIRE_FFMPEG is deliberately
          # not set either, so a package that needs it SKIPS -- and a skipped
          # test passes, which would publish "0 failed" for a test that never
          # executed. The guard below catches that: a run whose output contains
          # no ran-test evidence is refused rather than counted.
          # Sourced, not reimplemented -- the same reason the acceptance job
          # gives. This step used to compute the floor with its own inline awk
          # one-liner, which meant the number in the report had no test behind
          # it while the identical number in the other job did.
          . ./scripts/lib-observe.sh

          pass=0; fail=0
          : > outcomes.txt
          for i in $(seq 1 "$RUNS"); do
            start=$(date +%s)
            if go test "${ARGS[@]}" > "gotest-$i.log" 2>&1; then
              rc=PASS; pass=$((pass + 1))
            else
              rc=FAIL; fail=$((fail + 1))
            fi
            # Once, into a variable. It was two separate `date` calls reading
            # the same interval, which can straddle a second and print a
            # duration in the log that the table does not agree with.
            dur=$(( $(date +%s) - start ))
            printf '%s\t%s\t%ss\n' "$i" "$rc" "$dur" >> outcomes.txt
            echo "  run $i: $rc (${dur}s)"
            [ "$rc" = FAIL ] && tail -5 "gotest-$i.log" | sed 's/^/      /'

            # #206 POINT 2: THE CLOCK, NOT THE CAP, IS USUALLY WHAT STOPS THIS.
            # Projected from the first repetition and reported immediately,
            # because a job cancelled at the 60-minute ceiling publishes NO step
            # summary at all -- the operator would otherwise discover the budget
            # by losing the entire measurement. 3300s rather than 3600 leaves
            # the checkout, the toolchain and the artefact upload their measured
            # ~35s with a wide margin on top.
            if [ "$i" -eq 1 ]; then
              [ "$dur" -ge 1 ] || dur=1
              fits=$(( 3300 / dur ))
              echo "  one repetition cost ${dur}s, so about $fits fit inside this job's ceiling"
              if [ "$RUNS" -gt "$fits" ]; then
                echo "::warning::$RUNS repetitions at ${dur}s each is $(( RUNS * dur ))s, over the ~3300s this job has"
                echo "::warning::it will be cancelled at 60 minutes and publish no rate at all; $fits or fewer would report"
                # An `if` rather than `&&` so the block cannot end on a failing
                # status: at fits=0 the floor is undefined and refuses, and for
                # RUNS=1 this is the last statement the loop executes.
                ffits=$(poly_detectable_floor "$fits" 95) || ffits=""
                if [ -n "$ffits" ]; then
                  echo "::warning::at $fits runs the detectable floor is ${ffits}% -- see issue #206"
                fi
              fi
            fi
          done

          # "no test files" and a package that only SKIPS both exit 0. Either
          # would publish a clean rate for a measurement that never happened,
          # which is the one output this instrument must never produce.
          if grep -qE '^(ok|FAIL|---)' gotest-1.log; then :; else
            echo "::error::the first run produced no test result for $PKG"
            echo "::error::refusing to publish a rate: '0 failed' for a package that did not run reads as clean"
            sed 's/^/  /' gotest-1.log | head -20
            exit 1
          fi
          if grep -qE '^\s*ok.*\[no test files\]' gotest-1.log; then
            echo "::error::$PKG has no test files; there is nothing to measure"
            exit 1
          fi

          # The second lock, counted from what the loop WROTE rather than from
          # the input, exactly as the acceptance job does and for the reason
          # written there.
          measured=$(grep -c . outcomes.txt || true)
          if [ "${measured:-0}" -lt 1 ]; then
            echo "::error::no run was executed, so there is no rate to report"
            exit 1
          fi
          if [ "$measured" -ne "$RUNS" ] || [ "$((pass + fail))" -ne "$measured" ]; then
            echo "::error::recorded $measured outcome(s) and $((pass + fail)) tallied for $RUNS requested run(s)"
            exit 1
          fi

          floor=$(poly_detectable_floor "$measured" 95) || floor=""
          {
            echo "### go test on ${{ matrix.os }}: $fail of $measured failed"
            echo
            echo "Command: \`go test ${ARGS[*]}\`"
            echo
            if [ -n "$floor" ]; then
              echo "Detectable floor at $measured runs: about ${floor}% per-run failure rate."
              echo "A clean result here means \"no rate above ${floor}% is present on ${{ matrix.os }}\","
              echo "not \"not flaky\", and it says nothing about the other runners or about"
              echo "the acceptance suites -- see issue #206."
              echo
              # #206: the floor alone is abstract. Against the rates this
              # repository has actually MEASURED (#94, 1824 job records over 90
              # ci runs) it becomes a specific statement about which jobs a
              # green result here could and could not have cleared.
              echo "For scale, the rates measured on this repository: \`test: windows-latest\`"
              echo "9.72%, \`test: macos-latest\` 3.85%, \`go build, vet, test\` 2.86%,"
              echo "\`test: ubuntu-latest\` 2.60%. Only the first is above the floor at the cap"
              echo "of 40 runs (7.2%); the rest need 77 to 114 repetitions to resolve, which"
              echo "does not fit this job's ceiling. A clean result below the floor is"
              echo "\"not measurable here\", not \"not flaky\"."
            else
              echo "_The detectable floor could not be computed for $measured runs._"
            fi
            echo
            echo '| run | result | duration |'
            echo '|---|---|---|'
            awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' outcomes.txt
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RESULT $PKG on ${{ matrix.os }}: $fail/$measured failed"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-logs-go-${{ matrix.os }}
          path: gotest-*.log
          if-no-files-found: ignore
