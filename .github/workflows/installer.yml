# Run the installer's preflight on real distributions.
#
# shellcheck already runs on this script, and shellcheck cannot tell you that
# Fedora has no `ffmpeg` package, that EPEL's ffmpeg-free is below the version
# floor, or that installing FFmpeg on Ubuntu drags in `systemctl` and makes a
# `command -v systemctl` test pass inside a container with no init. All three
# were found by running the thing in a container, and all three are the kind of
# fact that rots quietly as distributions move.
#
# --check does the preflight and exits, creating nothing: no downloads, no
# users, no unit files. Safe to run anywhere, which is what makes it a test.
name: installer

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/acceptance-install.sh"
      - ".github/workflows/installer.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/acceptance-install.sh"
      - ".github/workflows/installer.yml"
  # Distributions change under us; a monthly run catches a moved floor before a
  # user does.
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: read

concurrency:
  group: installer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Flag handling and the argument validator, on one distro. These are
  # properties of the script rather than of the host, so once is enough.
  flags:
    name: flags and validation
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    # A ceiling, because GitHub's default is SIX HOURS. Measured at 9 to 17
    # seconds: pull ubuntu:24.04, then run install.sh a handful of times with
    # bad arguments. It installs no packages, which is what separates it from
    # the two preflight jobs below and why it gets a third of their budget.
    #
    # Five leaves room for a slow-but-alive registry and none for one that
    # accepts the connection and stops.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: --help exits 0 and prints usage
        run: |
          out="$(bash scripts/install.sh --help)"
          echo "$out" | head -3
          echo "$out" | grep -q -- "--check" || { echo "usage does not document --check"; exit 1; }

      - name: bad arguments are rejected
        run: |
          # Each of these must FAIL. A validator that accepts nonsense is worse
          # than none, because the nonsense surfaces later as a broken install.
          for bad in "--mode nonsense" "--tls bogus" "--http-port abc" "--srt-port x" "--wat"; do
            # shellcheck disable=SC2086
            if bash scripts/install.sh $bad >/dev/null 2>&1; then
              echo "accepted bad arguments: $bad"
              exit 1
            fi
          done
          echo "all five rejected"

      - name: root is required, and says so
        run: |
          useradd -m tester
          set +e
          out="$(su tester -c "bash scripts/install.sh --check --mode docker" 2>&1)"
          rc=$?
          set -e
          # Non-zero alone proves nothing: a parser or detection regression
          # exits non-zero too. Require the diagnostic that names the cause.
          [ "$rc" -ne 0 ] || { echo "ran as a non-root user"; exit 1; }
          echo "$out" | grep -q "run this with sudo" \
            || { echo "failed for some reason other than privilege: $out"; exit 1; }

      # The decisions install.sh makes without installing: the capability case,
      # the 443 offer, the firewall rules, and the upgrade script it writes.
      # That last one is why this step exists at all -- the suite had never run
      # anywhere but a laptop, and update.sh's five refusals had no test on any
      # machine. Pure bash against a temporary directory, about a second, and
      # the docker cases drive a stub rather than a daemon.
      - name: the installer's acceptance suite
        run: ./scripts/acceptance-install.sh

  # The preflight against each distribution's real package set. The floor and
  # the package names are what drift.
  preflight:
    name: "preflight: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # A ceiling, because GitHub's default is SIX HOURS -- and this job is the
    # exact shape that consumed one. Its first step is `apt-get update` plus an
    # FFmpeg install against a distribution mirror, which is what #92 caught
    # eating an entire acceptance job in ci.yml and reporting only "cancelled".
    # ci.yml answered that with a six-minute step timeout; here the install IS
    # most of the job, so the bound belongs on the job.
    #
    # Measured at 37 to 81 seconds across the four images, the slowest being
    # ubuntu:24.04. Fifteen is roughly eleven times that -- enough for a mirror
    # that is degraded but serving, which is the case that must not go red, and
    # far short of a mirror that has stopped answering.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clears the FFmpeg floor from default repositories.
          - { image: "ubuntu:24.04", ffmpeg: "6.1.1", expect: pass }
          - { image: "debian:13",    ffmpeg: "7.1.5", expect: pass }
          # Below the floor, and no amount of `apt install` fixes it. These
          # assert the REFUSAL, which is the useful half.
          - { image: "ubuntu:22.04", ffmpeg: "4.4.2", expect: fail }
          - { image: "debian:12",    ffmpeg: "5.1.9", expect: fail }
    steps:
      - name: Install git and FFmpeg
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq git ffmpeg >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Informational on purpose: it reports drift without failing, because the
      # verdict assertions below are what actually gate. Named so nobody reads
      # a green tick here as "the version is still X".
      - name: Report FFmpeg drift (does not fail)
        run: |
          got="$(ffmpeg -version | head -1 | awk '{print $3}')"
          echo "expected ${{ matrix.ffmpeg }}, got $got"
          case "$got" in
            "${{ matrix.ffmpeg }}"*) : ;;
            *) echo "::warning::FFmpeg moved on ${{ matrix.image }}: expected ${{ matrix.ffmpeg }}, got $got" ;;
          esac

      - name: Preflight, binary mode
        run: |
          set +e
          bash scripts/install.sh --check --mode binary
          rc=$?
          set -e
          echo "exit=$rc, expected ${{ matrix.expect }}"
          # A GitHub Actions container has no systemd, so the init gate always
          # fails here and the whole preflight is non-zero on every row. What
          # differs is the FFmpeg verdict, which is asserted below.
          [ "$rc" -ne 0 ] || { echo "preflight passed without systemd — the init gate is not firing"; exit 1; }

      - name: The FFmpeg verdict matches the distro
        run: |
          out="$(bash scripts/install.sh --check --mode binary 2>&1 || true)"
          echo "$out" | grep -E '^\[' || true
          if [ "${{ matrix.expect }}" = "pass" ]; then
            echo "$out" | grep -q "clears the 6.0 floor" \
              || { echo "expected this FFmpeg to clear the floor"; exit 1; }
          else
            echo "$out" | grep -q "below the 6.0 floor" \
              || { echo "expected this FFmpeg to be rejected"; exit 1; }
          fi

      # --check INSTALLS NOTHING, EVEN WHEN TOLD TO FORCE AN FFMPEG UPGRADE.
      #
      # check_ffmpeg now OFFERS to install a current static FFmpeg when the host
      # is below the floor, instead of only printing advice. That offer must not
      # reach a preflight: --check's entire contract is that it proves what a
      # host can be asked WITHOUT CHANGING IT, and this is the one combination
      # that could quietly break it -- `--check --ffmpeg force` reads as two
      # reasonable flags and would otherwise download and install a system
      # binary during what the operator was told is a dry run.
      #
      # Asserted on the below-floor images because they are the ones that reach
      # the offer at all. The file check is the assertion that matters; the
      # message is checked too so a silent skip cannot pass for a guard.
      - name: A forced upgrade during --check still changes nothing
        if: matrix.expect == 'fail'
        run: |
          before="$(ls -l /usr/local/bin/ffmpeg 2>/dev/null || echo absent)"
          out="$(bash scripts/install.sh --check --mode binary --ffmpeg force 2>&1 || true)"
          after="$(ls -l /usr/local/bin/ffmpeg 2>/dev/null || echo absent)"
          echo "$out" | grep -E '^\[|--check makes no changes' || true
          [ "$before" = "$after" ] \
            || { echo "--check --ffmpeg force MODIFIED /usr/local/bin/ffmpeg"; exit 1; }
          echo "$out" | grep -q -- "--check makes no changes" \
            || { echo "the offer was skipped silently rather than declining out loud"; exit 1; }

      # THE CAPABILITY PROBE, ON EVERY IMAGE IN THE MATRIX.
      #
      # check_ffmpeg now asks the binary to actually run polyemesis's own filter
      # shape -- the modern channel-layout API via `pan`, and `-progress`
      # emitting out_time_ms -- instead of deciding on a parsed version string.
      # In the script that probe is currently only a WARNING on the
      # already-passing path, because it had been run against exactly one build
      # and an under-tested probe should not be able to block installs on four
      # distributions nobody had tried it on.
      #
      # This is what earns it the right to become a refusal. It asserts the
      # probe passes wherever FFmpeg clears the floor, and fails the build if a
      # distribution ships an FFmpeg that cannot do this -- which is exactly the
      # thing worth learning early, on CI rather than on somebody's server.
      - name: FFmpeg can actually do what polyemesis needs
        if: matrix.expect == 'pass'
        run: |
          set +e
          ffmpeg -hide_banner -nostdin -loglevel error -progress pipe:1 \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000" \
            -filter_complex "[0:a]pan=mono|c0=0.5*c0+0.5*c1[a]" \
            -map "[a]" -t 0.1 -f null - 2>/dev/null | grep -q out_time_ms
          rc=$?
          set -e
          [ "$rc" -eq 0 ] || {
            echo "::error::FFmpeg on ${{ matrix.image }} cleared the version floor but could"
            echo "::error::not run the channel-layout + -progress probe check_ffmpeg uses."
            ffmpeg -version | head -1
            exit 1
          }
          echo "probe passed on ${{ matrix.image }}"

      - name: The init gate fires, and names the real reason
        run: |
          set +e
          out="$(bash scripts/install.sh --check --mode docker 2>&1)"
          rc=$?
          set -e
          # Docker mode needs no host FFmpeg, so the ONLY thing that can fail
          # here is the init gate. Asserting the status as well as the text is
          # what stops this passing vacuously if the gate were removed.
          [ "$rc" -ne 0 ] || { echo "docker preflight passed with no systemd"; exit 1; }
          echo "$out" | grep -q "systemd is not running as PID 1" \
            || { echo "the init gate did not fire, or changed its wording"; exit 1; }

      - name: --check creates nothing
        run: |
          # Listings compared directly rather than hashed. A hash answers "did
          # anything change"; the diff answers "what appeared", which is the
          # question you actually have at 2am. It also keeps a weak-hash
          # warning out of a step that is not doing cryptography.
          snap() {
            find /usr/local/bin /etc/systemd/system /var/lib /etc/polyemesis \
              -maxdepth 1 2>/dev/null | sort
          }
          snap > /tmp/before.txt
          bash scripts/install.sh --check --mode binary >/dev/null 2>&1 || true
          bash scripts/install.sh --check --mode docker >/dev/null 2>&1 || true
          snap > /tmp/after.txt
          if ! diff -u /tmp/before.txt /tmp/after.txt; then
            echo "--check modified the filesystem — see the diff above"
            exit 1
          fi
          # `if ! id ...` rather than `id ... && exit 1`. The second form
          # returns non-zero in the PASSING case -- no such user -- and under
          # set -e that fails the step for succeeding.
          if id polyemesis >/dev/null 2>&1; then
            echo "--check created the service account"
            exit 1
          fi
          echo "nothing created"

  # Package names differ across the RPM family, and getting them wrong sends a
  # user to a package that does not exist. Separate job: dnf, not apt.
  preflight-rpm:
    name: "preflight: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # Same reasoning and the same number as the preflight job above: a package
    # manager talking to a distribution mirror is the failure mode, dnf here
    # rather than apt. Measured at 21 to 43 seconds, so fifteen is more headroom
    # again than it buys there -- deliberately the same figure, because the
    # hazard is identical and two different numbers would invite the reader to
    # look for a distinction that does not exist.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:43", "rockylinux:9"]
    steps:
      - name: Install git
        run: dnf install -y -q git >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight names the right package for this family
        # Through env rather than interpolated, for the reason the ci.yml jobs
        # give: a `run:` block is a shell, and a matrix value is still a string
        # arriving from outside it.
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          out="$(bash scripts/install.sh --check --mode binary 2>&1 || true)"
          echo "$out" | grep -E '^\[|^     ' || true
          case "$IMAGE" in
            fedora*)
              # There is no `ffmpeg` package on Fedora at all.
              echo "$out" | grep -q "ffmpeg-free" \
                || { echo "Fedora hint missing: the package is ffmpeg-free"; exit 1; } ;;
            rocky*)
              echo "$out" | grep -qi "RPM Fusion" \
                || { echo "RHEL-family hint missing"; exit 1; } ;;
            # A case with no default arm asserts nothing about an image it does
            # not recognise, so adding almalinux:9 to the matrix above would
            # have bought a green tick and no check. Adding a row has to mean
            # deciding what hint that family should print.
            *)
              echo "no package-name assertion is written for $IMAGE"
              echo "add an arm to this case, or drop the row from the matrix"
              exit 1 ;;
          esac

  # THE JOBS ABOVE ONLY EVER RUN --check, AND THAT IS THE GAP THIS CLOSES.
  #
  # --check exits before install_binary_mode, write_helper_scripts, the unit
  # heredoc and the rollback trap have run, so the installer's DECISIONS were
  # well covered and its ACTIONS had never executed in CI at all.
  # acceptance-install.sh says the same of itself: "This does not run the
  # installer." Four defects were found in one afternoon by running it by hand on
  # a real host, and every one of them is invisible to --check.
  #
  # NOT IN A CONTAINER, which is the whole trick. Both modes end at
  # `systemctl enable --now`, and a container has no init -- which is why every
  # job above has to stop at the preflight. A GitHub-hosted ubuntu runner is a
  # VM with systemd as PID 1, so it can take a real root install. The runner is
  # destroyed afterwards, which is what makes trashing it acceptable.
  #
  # Ubuntu only, deliberately. A real install on Fedora or Rocky needs systemd
  # inside a privileged container and is fragile; the matrices above already
  # cover per-distro DETECTION, and the actions asserted here are the same on
  # every distro. Ubuntu end-to-end plus per-distro preflight is the honest
  # split, not a shortcut.
  install-uninstall:
    name: install, uninstall and interrupt, for real
    runs-on: ubuntu-latest
    # Measured at ~2 minutes: two installs, an uninstall, an interrupted install
    # and a reinstall, with no image builds. Eight leaves room for a slow release
    # download and none for a hung one.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: systemd is really PID 1 here
        run: |
          # If this ever stops being true the job below fails in a confusing way
          # instead of an obvious one.
          pid1="$(cat /proc/1/comm)"
          [ "$pid1" = systemd ] || { echo "PID 1 is $pid1, not systemd — this job assumes a VM runner"; exit 1; }

      # BINARY MODE REQUIRES FFmpeg ON THE HOST, and a GitHub runner has none.
      # The first draft of this job passed --ffmpeg skip and the installer
      # correctly refused: "no ffmpeg on PATH". That refusal is the installer
      # working, so the job has to bring one.
      #
      # The same pinned build and cache key ci.yml uses, deliberately rather than
      # `apt install ffmpeg`: #430 is open about apt being the largest source of
      # red CI, and a cache stops asking a mirror that is refusing. Reusing the
      # key means this job shares ci.yml's warm cache instead of populating a
      # second one.
      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ffcache
          key: ffmpeg-${{ runner.os }}-n8.1-latest-linux64-gpl-8.1-v1

      - name: Install FFmpeg
        run: |
          FFCACHE=/tmp/ffcache
          if [ -x "$FFCACHE/ffmpeg" ] && [ -x "$FFCACHE/ffprobe" ]; then
            echo "ffmpeg restored from cache"
          else
            for attempt in 1 2 3; do
              if curl -fsSL --proto '=https' --proto-redir '=https' \
                   --retry 3 --retry-all-errors --retry-delay 5 \
                   --connect-timeout 20 --max-time 90 \
                   -o /tmp/ff.tar.xz \
                   "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"; then
                break
              fi
              echo "ffmpeg download attempt $attempt failed"
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
            mkdir -p /tmp/ffbuild && tar xf /tmp/ff.tar.xz --strip-components=1 -C /tmp/ffbuild
            mkdir -p "$FFCACHE"
            cp /tmp/ffbuild/bin/ffmpeg /tmp/ffbuild/bin/ffprobe "$FFCACHE/"
          fi
          sudo install -m 0755 "$FFCACHE/ffmpeg"  /usr/local/bin/ffmpeg
          sudo install -m 0755 "$FFCACHE/ffprobe" /usr/local/bin/ffprobe
          # The installer gates on libsrt separately from the version, so a build
          # without it would fail the preflight for a reason unrelated to this job.
          ffmpeg -hide_banner -protocols | tr ' ' '\n' | grep -qx srt
          ffmpeg -hide_banner -version | head -1

      - name: Install, binary mode
        run: sudo bash scripts/install.sh --mode binary --yes --tls selfsigned --http-port 8080 --ffmpeg skip

      - name: The unit file contains only the unit
        run: |
          unit=/etc/systemd/system/polyemesis.service
          lines="$(sudo wc -l < "$unit")"
          echo "unit is $lines lines"
          # The template is ~40 lines. It once emitted 215, because a comment
          # quoting `ps` in an unquoted heredoc ran ps and wrote its output in.
          [ "$lines" -lt 80 ] || { echo "unit is $lines lines — something expanded into it"; sudo sed -n '1,40p' "$unit"; exit 1; }
          if sudo grep -qE '^ *[0-9]+ +\? +[0-9]{2}:[0-9]{2}:[0-9]{2}' "$unit"; then
            echo "the unit contains ps output — a command substitution ran in the heredoc"
            exit 1
          fi
          # systemd-analyze verify, NOT journalctl. Grepping the journal makes the
          # check depend on how much history the runner happens to hold, and it
          # only works after the service has started. This reads the file.
          #
          # Its EXIT CODE IS USELESS: verified against a unit with ps output
          # spliced into it, and it printed four "Missing '='" lines and still
          # exited 0. The output is the signal.
          verdict="$(systemd-analyze verify "$unit" 2>&1 || true)"
          if printf '%s\n' "$verdict" | grep -q "Missing '='"; then
            echo "systemd cannot parse lines of the unit:"
            printf '%s\n' "$verdict" | head -5
            exit 1
          fi

      - name: The hardening directives actually applied
        run: |
          # A malformed unit still starts, with the lines systemd could not read
          # silently dropped. These are the ones worth losing loudly.
          for pair in "ProtectProc=invisible" "ProtectSystem=strict" "NoNewPrivileges=yes" "PrivateTmp=yes"; do
            k="${pair%%=*}"; want="${pair#*=}"
            got="$(systemctl show polyemesis -p "$k" --value)"
            [ "$got" = "$want" ] || { echo "$k is '$got', want '$want'"; exit 1; }
            echo "$k=$got"
          done

      - name: Binary mode gets its helper scripts
        run: |
          # write_helper_scripts was called only in the docker branch, so its own
          # "if MODE != docker" arm was unreachable and #347 never shipped.
          for f in /opt/polyemesis/update.sh /opt/polyemesis/uninstall.sh; do
            [ -x "$f" ] || { echo "missing or not executable: $f"; ls -la /opt/polyemesis || true; exit 1; }
            echo "ok $f"
          done

      - name: The service is up and answering
        run: |
          for _ in $(seq 1 20); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1:8080/ || true)"
            if [ "$code" = "200" ]; then echo "answered 200"; exit 0; fi
            sleep 1
          done
          echo "never answered 200 (last: ${code:-none})"
          sudo journalctl -u polyemesis --no-pager | tail -30
          exit 1

      - name: Uninstall removes what it added and keeps what is yours
        run: |
          before="$(sudo md5sum /var/lib/polyemesis/secret.key | cut -d' ' -f1)"
          sudo /opt/polyemesis/uninstall.sh
          for gone in /usr/local/bin/polyemesis /etc/polyemesis /etc/systemd/system/polyemesis.service; do
            if [ -e "$gone" ]; then echo "uninstall left $gone behind"; exit 1; fi
          done
          # A unit systemd still lists, whose binary is gone, fails a later start
          # against nothing.
          n="$(systemctl list-unit-files | grep -c '^polyemesis' || true)"
          [ "$n" -eq 0 ] || { echo "systemd still lists the unit"; exit 1; }
          # Kept, deliberately: it holds the database and secret.key.
          [ -d /var/lib/polyemesis ] || { echo "uninstall DELETED the data directory"; exit 1; }
          after="$(sudo md5sum /var/lib/polyemesis/secret.key | cut -d' ' -f1)"
          [ "$before" = "$after" ] || { echo "secret.key changed during uninstall"; exit 1; }
          echo "data kept, secret.key unchanged"

      - name: An interrupted install rolls back, once, and leaves nothing
        run: |
          sudo rm -rf /var/lib/polyemesis
          set +e
          out="$(sudo timeout -s INT 3 bash scripts/install.sh --mode docker --yes --tls selfsigned --http-port 8080 2>&1)"
          set -e
          echo "$out" | tail -8
          # The trap is armed for EXIT INT TERM, so SIGINT once ran the whole
          # rollback twice and reported the same failure twice.
          n="$(printf '%s\n' "$out" | grep -c 'undoing what it had already done' || true)"
          [ "$n" -eq 1 ] || { echo "rollback announced $n times, want exactly 1"; exit 1; }
          for gone in /opt/polyemesis /etc/polyemesis /etc/systemd/system/polyemesis.service; do
            if [ -e "$gone" ]; then echo "rollback left $gone behind"; exit 1; fi
          done
          echo "rolled back once, cleanly"

      - name: Installing again after an interruption works
        run: |
          sudo bash scripts/install.sh --mode docker --yes --tls selfsigned --http-port 8080
          docker ps --format '{{.Names}} {{.Status}}' | head -2
          for _ in $(seq 1 30); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1:8080/ || true)"
            if [ "$code" = "200" ]; then echo "answered 200 after reinstall"; exit 0; fi
            sleep 2
          done
          echo "never answered 200 after reinstall"
          sudo docker compose -f /opt/polyemesis/docker-compose.yml logs --tail 40 || true
          exit 1
