# Dependency updates.
#
# Grouped and weekly rather than one PR per bump: this repository has nine
# direct Go dependencies on purpose, and a PR per patch release would drown the
# signal that matters -- a SECURITY advisory.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/ui"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Radix ships fourteen packages that move together; fourteen PRs for one
      # upstream release is noise, not diligence.
      radix:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node's major must match the Node the Dockerfiles run, and that
      # is pinned to an LTS -- see the docker section below for the date this
      # comes off. Without this, Dependabot reopens the major every week and
      # the PR is unmergeable on its own: it would typecheck against a Node
      # this project does not ship.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # web/, THE DOCUMENTATION SITE, WHICH WAS NOT HERE. Its package-lock.json is
  # 342 KB and nothing watched it: not this file, not the npm-audit job in
  # security.yml, which named ui/ alone. A static site does not ship its
  # dependencies to a server, but it does build on a runner, which is the path
  # that matters.
  #
  # Ungrouped on purpose. ui/ groups Radix because fourteen packages move
  # together there; web/ has no such family, and inventing a group for a handful
  # of build-time packages would only hide which one changed.
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native compiler rewrite, and `astro check` cannot
      # run against it: TS7 exposes only `version` and `versionMajorMinor`,
      # while Volar and the TypeScript Language Service API that `astro check`
      # is built on need `ts.sys`, `ts.findConfigFile` and LanguageServiceHost.
      # web/'s build is `astro check && astro build && …`, so taking the bump
      # would trade a type-checked site for a newer type checker.
      #
      # The hold is here rather than left to a standing red PR. #669 sat
      # unmergeable for eleven days, and a permanently failing PR is not a
      # reminder -- it is training to ignore a red check. #520 is the reminder.
      #
      # REMOVE THIS WHEN #520 CLOSES. The trigger is an upstream event rather
      # than a date, deliberately, and that is the weaker kind: the Node hold
      # below can name 2026-10-28 because the calendar decides it, whereas this
      # one waits on withastro/roadmap#1321 and nobody here sets that date.
      # Rechecked 2026-09-10 against typescript 7.0.2, @astrojs/check 0.9.10 and
      # @astrojs/language-server 2.16.16 -- the guard is still in the shipped
      # check.js. The recheck is recorded on #520 so the next one starts from
      # the answer.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The actions are pinned by major tag; this is what notices a v7 -> v8.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }

  # Base images. The FFmpeg pin inside them is deliberate and NOT managed here
  # -- see the comment in the Dockerfile about a rebuild silently becoming a
  # different product.
  #
  # Every FROM in the three root Dockerfiles is tag@sha256 (staging-readiness
  # row 41), so upstream security fixes to a base image reach a release ONLY
  # through the digest bumps this entry proposes. Merge them; they are the
  # replacement for the floating tag that used to pick fixes up on its own.
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      # Node MAJORS are held to LTS releases, and this is a dated hold rather
      # than a permanent one.
      #
      # Node 26 was released 2026-05-05 and does not become LTS until
      # 2026-10-28. Node 24 is Active LTS with support to 2028-04-30, so there
      # is no pressure and nothing to gain from running a Current release in an
      # image people deploy and leave running for months.
      #
      # REMOVE THIS AFTER 2026-10-28. An ignore rule with no stated trigger
      # becomes permanent by accident, which is how a project ends up on an
      # end-of-life runtime while its dependency bot sits quiet.
      #
      # Bumping it is a THREE-part change that Dependabot cannot do alone: the
      # node: tag in all three Dockerfiles, the five node-version pins across
      # ci.yml and release.yml, and @types/node's major. ci.yml says so at the
      # first pin. Merging any one of them alone breaks that invariant quietly.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # The CUDA line is held on purpose, and PERMANENTLY rather than dated:
      # Dockerfile.cuda links no CUDA library (NVENC needs only the host
      # driver), and the tag's NVIDIA_REQUIRE_CUDA check is what refuses to
      # start on a host whose driver is behind. A newer CUDA line buys nothing
      # and turns away working machines -- #857 proposed 12.6.3 -> 13.4.1 on the
      # same Ubuntu, i.e. a higher driver floor for no change at all.
      #
      # Digest updates of the pinned tag still arrive, and they are how base
      # image security fixes reach a digest-pinned FROM. Bump the CUDA line by
      # hand, and only when moving to a new Ubuntu release (which is what
      # decides the FFmpeg version) -- see the comment above FROM in
      # Dockerfile.cuda.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
