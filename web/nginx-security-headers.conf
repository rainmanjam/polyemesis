# Security headers, in a snippet because nginx will not inherit them.
#
# `add_header` is NOT additive across levels: a location block that declares any
# add_header of its own discards every add_header inherited from the server
# block. So the /_astro/ and asset locations — which set Cache-Control — were
# silently serving JavaScript and fonts with no X-Content-Type-Options and no
# CSP at all, while the HTML pages beside them had both. Verified against the
# running container, not inferred.
#
# `include`ing this everywhere an add_header appears is the only way to keep the
# set complete. If you add a location with an add_header, include this too.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy
    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
