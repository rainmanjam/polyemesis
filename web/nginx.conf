server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # Cloud Run terminates TLS and talks HTTP to the container, so anything
    # about certificates belongs in front of this, not here.

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # Astro is configured to emit flat files, so /features is /features.html.
    # Trying $uri.html before $uri/ is what keeps the extra 301 off every
    # internal navigation.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # no-cache, not no-store: the page may be held, it must just be
        # revalidated before reuse. This is the block that actually serves
        # /features and /docs.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Content-hashed by the build, so it can be cached hard and forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Fonts and screenshots are stable but NOT content-hashed, so a week rather
    # than a year: long enough to matter, short enough that replacing a
    # screenshot reaches people.
    location ~* \.(woff2|png|jpg|svg|webm|mp4)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # HTML must revalidate, or a deploy does not reach anyone still holding a tab.
    #
    # This used to be `location ~* \.html$`, which never matched anything. The
    # site serves extensionless URLs — /features is resolved to /features.html
    # by try_files — so the REQUEST URI has no .html for the regex to match, and
    # every page went out with no Cache-Control at all. A page cached by
    # heuristic freshness then keeps referencing /_astro/ hashes that the next
    # deploy has already removed. Matching on the served content type instead is
    # what makes it actually apply.
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # Cloud Run's health check wants something cheap that is not the whole page.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
