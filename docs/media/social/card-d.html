<!doctype html>
<meta charset="utf-8">
<title>polyemesis social card — D, typographic minimum</title>
<style>
  /* Tokens copied verbatim from ui/src/index.css. The card is the product's
     own palette, not an approximation of it — DESIGN-SYSTEM.md's whole point is
     that :root is the system and every consumer reads the same block. */
  :root {
    --surface: #0f1115;
    --card: #141821;
    --muted: #1c222e;
    --muted-foreground: #8b94a7;
    --subtle-foreground: #5d6779;
    --border: #232a38;
    --border-strong: #303a4d;
    --live: #3ecf6d;
    --armed: #45b5d0;
    --meter-low: #3ecf6d;
    --meter-mid: #cfd23e;
    --meter-high: #e8a33d;
    --meter-peak: #e5484d;
    --meter-bg: #12161e;
    --foreground: #e6e9ef;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px; height: 640px;
    background: var(--surface);
    color: var(--foreground);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* No panel. A social card is seen small far more often than large, so this
     variant spends the whole frame on the four things that survive being
     400px wide: the wordmark, the claim, one line of proof, and the meter. */
  .card {
    width: 100%; height: 100%;
    padding: 56px 64px;
    display: flex; flex-direction: column;
    position: relative;
  }

  .card::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(1000px 460px at 6% 104%, rgba(62,207,109,.11), transparent 66%),
      radial-gradient(760px 360px at 78% -6%, rgba(69,181,208,.07), transparent 62%);
    pointer-events: none;
  }

  .wordmark {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 15px;
  }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 34px; }
  .bars i { width: 5px; border-radius: 1px; display: block; }
  .name { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }

  .mid {
    position: relative; z-index: 1;
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
  }

  /* Two lines, per DESIGN-SYSTEM.md's rule for the hero, and large enough that
     the whole claim is still readable when the card is 400px wide. */
  h1 {
    font-size: 92px; line-height: 1.02; font-weight: 660;
    letter-spacing: -0.035em;
    margin-bottom: 30px;
  }
  h1 em { font-style: normal; color: var(--live); }

  .sub {
    font-size: 25px; line-height: 1.4; color: var(--muted-foreground);
    max-width: 42ch;
  }

  /* The one graphic. DESIGN-SYSTEM.md: "The hero should be the meter. It is the
     one thing no competitor's landing page can show honestly." Three segments
     at three different post-routing levels — the same argument the incumbent's
     panel makes, reduced to the part that still reads at thumbnail size. */
  .meters {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;
    margin-top: 34px;
  }
  .m-label {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--muted-foreground);
    display: flex; justify-content: space-between;
    margin-bottom: 8px;
  }
  .m-label b { color: var(--foreground); font-weight: 550; }
  .track {
    height: 10px; border-radius: 5px;
    background: var(--meter-bg);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .track i {
    display: block; height: 100%;
    background: linear-gradient(90deg,
      var(--meter-low) 0%, var(--meter-low) 62%,
      var(--meter-mid) 82%, var(--meter-high) 94%, var(--meter-peak) 100%);
  }

  .foot {
    position: relative; z-index: 1;
    margin-top: 30px;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 15px;
    color: var(--muted-foreground);
  }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--live); }
</style>

<div class="card">
  <div class="wordmark">
    <div class="bars" id="bars"></div>
    <div class="name">polyemesis</div>
  </div>

  <div class="mid">
    <h1>One stream in.<br>A <em>different mix</em> out of each.</h1>

    <p class="sub">
      Self-hosted restreaming with per-destination audio routing.
      Video is copied, not re-encoded.
    </p>
  </div>

  <div class="meters">
    <div>
      <div class="m-label"><b>YouTube</b><span>mic+music+co-host</span></div>
      <div class="track"><i style="width:88%"></i></div>
    </div>
    <div>
      <div class="m-label"><b>Twitch</b><span>no music</span></div>
      <div class="track"><i style="width:69%"></i></div>
    </div>
    <div>
      <div class="m-label"><b>Podcast</b><span>mic only</span></div>
      <div class="track"><i style="width:44%"></i></div>
    </div>
  </div>

  <div class="foot">
    <span class="dot"></span> SRT multitrack · RTMP · MIT
  </div>
</div>

<script>
  /* The wordmark's meter bars. Deterministic heights rather than random, so
     re-rendering the card produces the same image. */
  const heights = [11, 20, 29, 34, 25, 16, 23, 31];
  const colours = ["--meter-low","--meter-low","--meter-mid","--meter-high",
                   "--meter-mid","--meter-low","--meter-low","--meter-mid"];
  const el = document.getElementById("bars");
  heights.forEach((h, i) => {
    const b = document.createElement("i");
    b.style.height = h + "px";
    b.style.background = `var(${colours[i]})`;
    el.appendChild(b);
  });
</script>
