# Prometheus for the polyemesis monitoring example (docker-compose.yml here).
# docs/GRAFANA.md walks through it; docs/MONITORING.md explains every metric.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: polyemesis
    metrics_path: /api/v1/metrics
    # The endpoint needs an API token (Settings -> API tokens; a read token is
    # enough). Put it, alone, in deploy/monitoring/polyemesis.token.
    authorization:
      credentials_file: /etc/prometheus/polyemesis.token

    # polyemesis from the repository's docker-compose.yml, published on the
    # host's port 8080 over plain HTTP. Plain HTTP is acceptable ONLY because
    # this hop never leaves the machine (or a private network you control):
    # the token is sent in the clear on every scrape.
    scheme: http
    static_configs:
      - targets: ['host.docker.internal:8080']

    # A native install (install.sh) terminates TLS itself on :443. Use this
    # instead, with the install's CA copied next to this file and mounted in
    # docker-compose.yml -- see docs/MONITORING.md, "The metrics endpoint":
    #
    # scheme: https
    # static_configs:
    #   - targets: ['stream.example.com:443']
    # tls_config:
    #   ca_file: /etc/prometheus/polyemesis-ca.crt
