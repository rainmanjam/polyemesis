# gitleaks configuration.
#
# Six findings in this repository are test fixtures: deliberately
# realistic-looking stream keys and ingest URLs, which exist precisely so the
# redaction and URL-splitting code can be tested against something that looks
# like the real thing. They are not credentials and never were.
#
# They are allowlisted by path and by value rather than globally disabling the
# rule, because "generic-api-key found nothing" has to keep meaning something.
# Six permanent known-failures is how a scanner stops being read at all, and a
# blanket `[allowlist] paths = ['''_test\.go$''']` would hide a real key
# committed to a test file — which is exactly where one tends to get committed.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  # AND, not the default OR. With OR, listing the paths below would allowlist
  # ANY secret in those two files, including a real one committed by accident —
  # and a test file is exactly where a real key tends to get committed by
  # accident. Requiring both conditions means only these specific known
  # fixture values are ignored, and only in the files they belong to.
  condition = "AND"
  regexTarget = "match"
  regexes = [
    # The fake YouTube stream key redact_test.go asserts is masked. If
    # redaction ever breaks, that test fails — a better signal than gitleaks
    # flagging the fixture forever.
    '''live_284729384_pQ8fZmT3xR9wLkYvB2nHsA''',
    # Facebook's fixture ingest URLs: a hostname and a digit run, in
    # splitIngestURL's table of what a real ingest URL looks like.
    '''rtmp-api\.facebook\.com:\d+''',
  ]
  paths = [
    '''internal/alerts/redact_test\.go''',
    '''internal/oauth/facebook_test\.go''',
  ]
