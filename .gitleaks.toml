# gitleaks configuration.
#
# Six findings in this repository are test fixtures: deliberately
# realistic-looking stream keys and ingest URLs, which exist precisely so the
# redaction and URL-splitting code can be tested against something that looks
# like the real thing. They are not credentials and never were.
#
# They are allowlisted by path and by value rather than globally disabling the
# rule, because "generic-api-key found nothing" has to keep meaning something.
# Six permanent known-failures is how a scanner stops being read at all, and a
# blanket `[allowlist] paths = ['''_test\.go$''']` would hide a real key
# committed to a test file — which is exactly where one tends to get committed.

[extend]
useDefault = true

# Two historical commits are exempted, by SHA.
#
# 5cbe821 added the allowlist self-test below and wrote its planted, made-up
# credential as a literal directly into .github/workflows/security.yml. That
# made the workflow file itself a finding. 1076b61 removed the literal — the
# value is now assembled from two parts at run time — but removing a secret in
# a later commit does not unpublish it, which is exactly the property the
# full-history scan exists to enforce and is not one worth weakening.
#
# So the commit is allowlisted rather than the value or the path:
#
#   - Allowlisting the VALUE would stop the self-test below from working, since
#     that test depends on precisely this string being detected.
#   - Allowlisting the PATH would exempt the workflow file forever, including
#     from a real credential added to it later.
#   - Allowlisting the COMMIT exempts one immutable, already-reviewed diff and
#     nothing else. The same string is still caught anywhere it appears again.
#
# The string was invented for this test, matches no real service, and was never
# valid anywhere. It was a fixture that briefly sat in the wrong file.
#
# a357faf is the same shape a second time, which is why this is a list rather
# than a special case. It wrote a Twitch stream-key FIXTURE as
# `live_1_abcdefghijklmnop` next to a `StreamKey:` identifier, and
# generic-api-key fires on a credential-SHAPED literal beside a credential-shaped
# name — it cannot tell an invented one from a real one, which is the whole
# reason it is worth running. 91e0d47 replaced it with `sk-live-vod`, matching
# the deliberately unconvincing keys every other test in that file uses
# ("original-key", "key"). But a value removed in a later commit is still in the
# earlier one, and the PR scan reads the range, not the tip.
#
# Allowlisted by COMMIT for the same three reasons as above, and the second is
# the one that matters here: the path is `internal/api/vod_profile_roundtrip_test.go`,
# and exempting a test file forever is exactly what the header of this file
# refuses to do. A real key committed to that file tomorrow is still a finding.
[allowlist]
description = "Made-up fixture values that briefly lived in the wrong commits"
commits = [
  "5cbe821ff686ddcc59aee9a8aa830269122e9c36",
  "a357fafffad25b8912a5c08aa16312adbedce09d",
  # Trovo's own PUBLISHED response samples, transcribed byte-for-byte into
  # trovo_test.go so the fixture could pin the shape -- above all expires_in
  # arriving as a quoted STRING, which an int field cannot decode and which a
  # hand-written fixture gets wrong. Trovo prints these 32-hex tokens in its
  # public documentation; they were never anyone's credential.
  #
  # The working tree no longer contains them -- the second commit replaced
  # them with obviously-fake strings while keeping the shape -- but a diff
  # that REMOVES a value still contains it, which is the property the
  # range scan exists to enforce and is not one worth weakening. So both
  # commits are exempted rather than the path or the value: the path would
  # exempt trovo_test.go forever, and the value would have to be repeated
  # here, putting the strings back into the tree this removed them from.
  "9405ae12ceede97db38a12e772cbea6d99e1be5c",
  "720ac4bdf3c12107a64dfd492b4a44107f212a7e",
]

# AND THE GENERATED CODE INDEX, WHICH IS NOT SOURCE.
#
# `gitnexus analyze` writes a ~128 MB index under .gitnexus/ containing copies
# of the code it indexed -- including the fixtures allowlisted below. `gitleaks
# detect --no-git` reads the WORKING TREE and does not consult .gitignore, so
# once anyone indexes locally the scan reports seven findings inside
# .gitnexus/lbug and this repository's own security check starts crying wolf. A
# check people learn to skip is worse than no check.
#
# SAFE HERE FOR A REASON THAT DOES NOT GENERALISE. The header above rightly
# refuses a blanket path allowlist for test files, because a real key committed
# to a test file is exactly the kind that gets committed. This is different in
# kind: .gitnexus/ is generated, never committed (see .gitignore), and derived
# ENTIRELY from tracked source. A credential cannot appear here without also
# appearing in the source it was built from, where the scanner still sees it.
# This removes a duplicate report, not a detection.
paths = [
  '''^\.gitnexus/''',
]

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  # Plural [[rules.allowlists]] rather than the singular [rules.allowlist]:
  # gitleaks refuses a config that mixes the two, and a second block is what
  # keeps each set of fixtures scoped to the files it belongs to.
  [[rules.allowlists]]
  description = "YouTube and Facebook URL fixtures for the alerts redactor"
  # AND, not the default OR. With OR, listing the paths below would allowlist
  # ANY secret in those two files, including a real one committed by accident —
  # and a test file is exactly where a real key tends to get committed by
  # accident. Requiring both conditions means only these specific known
  # fixture values are ignored, and only in the files they belong to.
  condition = "AND"
  regexTarget = "match"
  regexes = [
    # The fake YouTube stream key redact_test.go asserts is masked. If
    # redaction ever breaks, that test fails — a better signal than gitleaks
    # flagging the fixture forever.
    '''live_284729384_pQ8fZmT3xR9wLkYvB2nHsA''',
    # Facebook's fixture ingest URLs: a hostname and a digit run, in
    # splitIngestURL's table of what a real ingest URL looks like.
    '''rtmp-api\.facebook\.com:\d+''',
  ]
  paths = [
    '''internal/alerts/redact_test\.go''',
    '''internal/oauth/facebook_test\.go''',
  ]

  # A SECOND block rather than more entries in the one above, because these
  # values and those values do not belong in each other's files. With AND, one
  # merged block would allowlist the YouTube fixture inside the supervisor's
  # tests and the Facebook fixture inside alerts' — which nothing needs, and
  # each widening of a scanner's blind spot should have to earn itself.
  [[rules.allowlists]]
  description = "Facebook stream-key fixtures for the redaction guards"
  # Same reasoning as the block above: value AND path, never either alone.
  condition = "AND"
  regexTarget = "match"
  regexes = [
    # The invented Facebook stream keys the redaction guards assert are masked.
    # They exist to look exactly like the real thing, which is the whole point:
    # a fixture that does not resemble a credential proves nothing about a
    # redactor. Shared by the supervisor's guards and the /processes endpoint
    # guards, which is why both files are listed.
    #
    # If redaction ever breaks, those tests fail -- a better signal than
    # gitleaks flagging the fixture for ever.
    '''FB-101234567890123-0-[A-Za-z]+''',
  ]
  paths = [
    '''internal/supervisor/redact_test\.go''',
    '''internal/api/handlers_test\.go''',
  ]

    # A THIRD block, for the debug recorder's disclosure test.
    #
    # internal/diag exports a bundle of log records to somebody who does NOT
    # have the operator's box, so its test plants a credential in every shape a
    # slog record can carry one and asserts none survives to the export.
    #
    # Those plants have to LOOK like the real thing. A value shorter than
    # alerts.MinSecretLen is refused by the secret set outright, and one that
    # does not resemble a platform key would not exercise the residual
    # alerts.Redact pass either -- so a fixture gitleaks ignores would be a
    # fixture that proves less. It is correct for the scanner to flag these.
    #
    # Same AND condition and the same reasoning as the blocks above: the values
    # are named one by one and scoped to the single file, so a REAL key
    # committed to that test file is still a finding. If the scrubbing ever
    # breaks, the disclosure test fails by name -- a better signal than gitleaks
    # flagging a fixture for ever.
    [[rules.allowlists]]
    description = "planted credentials for internal/diag's export disclosure test"
    condition = "AND"
    regexTarget = "match"
    regexes = [
      # The stream key planted in the message, an attribute value, an attribute
      # KEY, an argv slice, a wrapped error, a nested map and a URL.
      '''live_884471209_kQxZ7fRvB2mNpL0sTdWyGhJcAe5U''',
      # Its rotated successor, for the SetSecrets case.
      '''live_884471209_ZZrotatedZZ9988776655443322110099''',
      # A pull SOURCE's credentials -- a camera password, a CDN auth token and a
      # publish token. Added after a pre-push review found the recorder's secret
      # set was built from destinations only, so none of these was masked.
      '''rtspCameraPassw0rd2026''',
      '''hdnts_exp1798761600_acl_hmac_9f2c1d4b8a6e3f07''',
      '''Dxl1Gevc3Tas4XHlMxAGMXwmO0bJ96Hj''',
    ]
    paths = [
      '''internal/diag/disclosure_test\.go''',
    ]
