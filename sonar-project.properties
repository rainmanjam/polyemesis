# SonarCloud configuration.
#
# STILL MINIMAL. This file does not set sonar.sources or sonar.tests: the
# scanner's defaults analyse this repository correctly and narrowing them from
# here would be a second thing to keep in step with the tree for no gain.
#
# ANALYSIS IS NOW CI-BASED, which is a change from what this file used to say.
# .github/workflows/sonar.yml runs the scanner and its header records why in
# full; the short version is that Automatic Analysis ignores this file and the
# project settings alike, so every exclusion below was inert. Two independent
# measurements said so -- see the note at the end -- and under CI-based analysis
# they bind.
#
# S2068 is "hard-coded credentials". Measured against the SonarCloud API on
# 2026-08-08, the project has 39 of them and every one is a false positive:
#
#   json:S2068         37   ui/src/lib/i18n/*.json   (nl 13, id 10, tr 6, pt-BR 4, de 3, en 1)
#   typescript:S2068    1   ui/e2e/auth.setup.ts
#   go:S2068            1   internal/db/platforms.go:789
#
# WHAT IS NOT CLAIMED. An earlier version of this file said the next locale PR
# would fail the quality gate on these. There is no evidence for that. The gate
# is new-code-only -- new_reliability_rating, new_security_rating,
# new_maintainability_rating, new_duplicated_lines_density and
# new_security_hotspots_reviewed -- and it passes today with all 39 present. A
# locale PR adding new translated strings would put new S2068 findings on new
# code, which is the case that has not been observed either way.
#
# So the reason for these exclusions is signal, not a broken gate: a security
# rule that reports 39 findings and is wrong about all 39 is a rule nobody reads,
# and a real hard-coded credential would be invisible among them.
#
# SCOPED PER RULE AND PER PATH, never blanket. S2068 stays live everywhere else,
# which is the whole point -- these three paths are excluded because each was
# looked at, not because the rule is inconvenient.
#
# NOTE ON EFFECT. Under the automatic analysis this project used to run, these
# were almost certainly inert -- see the note at the end of this file, which
# stopped being a guess and became a measurement. Under the CI-based analysis it
# runs now they are honoured, so the counts above are the ones to check against
# the next report.

sonar.projectKey=rainmanjam_polyemesis
sonar.organization=rainmanjam

# SCOPED SUPPRESSIONS, EACH PAIRED WITH A TEST THAT MAKES IT TRUE.
#
# An ignore rule on its own is rung zero: it silences a finding and relies on
# whoever added it having been right, forever. Every entry below therefore names
# the guard that keeps its justification honest, and each of those guards has
# been mutation-tested -- break the property, the build goes red, and the ignore
# stops being a claim nobody checks.
#
#   e1-e3  json/typescript/go S2068  translation strings and committed platform
#                                    data that contain the WORD "password".
#   e4     go:S5542                  internal/chat/kick_verify.go only. PKCS#1
#                                    v1.5 there VERIFIES a signature Kick
#                                    produced; the padding is Kick's spec, not
#                                    our choice, and there is no private key or
#                                    decryption oracle in the process. Guard:
#                                    TestPKCS1v15IsConfinedToVerifyingKicksSignature
#                                    fails if v1.5 appears anywhere else in the
#                                    tree, or is used to sign or decrypt.
#   e5     go:S2077                  internal/db. The only non-constant fragment
#                                    in any query is an IN-clause placeholder
#                                    list from placeholders(), which can emit
#                                    nothing but "?" and ","; values are bound.
#                                    Guards: TestNoHandRolledPlaceholderLists
#                                    (no second way to build one) and
#                                    TestPlaceholdersEmitsOnlyQuestionMarksAndCommas.
#   e7,e10 go:S2092, and e8 go:S3330  cookie flags, named FILE BY FILE and not
#                                    by directory. e7 was written as
#                                    internal/**/*.go first, which would have
#                                    silenced a missing Secure flag on any cookie
#                                    anywhere in internal/ -- including one added
#                                    next year that no guard here covers. That is
#                                    an allowlist exempting files rather than
#                                    values, which is the exact failure the
#                                    gitleaks job plants a secret every run to
#                                    prevent. The two files below are the two the
#                                    guards actually cover. Secure is conditional because
#                                    this is self-hosted software that runs on
#                                    plain HTTP in a lab and behind a
#                                    terminating proxy in production; hardcoding
#                                    it drops the session on both. HttpOnly is
#                                    false on the CSRF cookie ALONE, because
#                                    double-submit requires the SPA to read it.
#                                    Guards: TestSecureIsSetWheneverTheConnectionIsAndNotWhenAClientSaysSo
#                                    (including that a forged X-Forwarded-Proto
#                                    does NOT set it without trustProxy),
#                                    TestTheSessionCookieIsNeverReadableByScript,
#                                    TestThePlayoutCookieIsScopedAndNeverScriptReadable
#                                    and TestSameSiteNoneIsNeverSetWithoutSecure.
#   e6     typescript:S5332          the destination dialog's rtmp:// presets,
#                                    which mirror platforms.go and are offered
#                                    BESIDE rtmps ones -- some ingests and some
#                                    networks take nothing else, and a
#                                    self-hosted PeerTube may have no TLS ingest
#                                    at all. Guards:
#                                    TestAPlatformWithAPublishedTLSIngestOffersIt
#                                    (a platform that publishes TLS must still
#                                    offer it) and
#                                    TestAPresetsTransportMatchesTheSchemeItActuallyCarries
#                                    (a preset cannot claim RTMPS and ship rtmp).
#
# NOT suppressed, and fixed instead: docker:S6505 (web/Dockerfile now installs
# with --ignore-scripts, verified by a real build) and githubactions:S8264 (both
# workflows dropped to `permissions: {}` with every job declaring its own).
#
#   e9     gosecurity:S5146         the HTTP-to-HTTPS redirect reflecting the
#                                    request's Host when tls.hostname is unset.
#
# e9 is the one that took a wrong turn first, and the record is worth keeping.
# The obvious fix was to refuse a reflected DNS name -- reflect only an IP
# literal, which carries no name to impersonate. That was written, and
# cmd/polyemesis/redirect_test.go rejected it: TestOrdinaryHostsStillRedirect
# pins box.local, my-box.lan and polyemesis with "an operator who has not set
# tls.hostname must still get a working redirect". Reaching this box by a name
# the local network resolves is a supported case someone had already guarded,
# so the change was reverted rather than argued with.
#
# What the finding actually is, and it is written at the top of that test file
# already: a victim's browser cannot be made to send a forged Host here, so the
# direct steer is not the risk. The risk is a shared cache in front of the
# server storing a redirect whose Location a stranger chose and replaying it.
# Three things stop that -- the reflected branch answers with a TEMPORARY
# redirect, sets Cache-Control: no-store, and adds Vary: Host.
#
# Two of those three were guarded. The third was not, and this is what came out
# of checking rather than trusting the claim: deleting no-store and Vary from
# the reflected branch left every test in that file green, because they all
# request /some/path?a=1 and a query string triggers a SECOND, unrelated
# no-store added for watch tokens. One test path, two independent mitigations,
# and only one of them being measured.
# TestAReflectedHostIsUncacheableEvenWithNothingToLeak now asks for "/" so the
# token rule cannot fire, and it is red if either line goes.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10

# e1 — translated UI labels. The finding is on the KEY, not a value: a locale
# file pairing "password" with "Wachtwoord" is a button caption, and every one of
# the 37 reads like `"Password" detected here, make sure this is not a hard-coded
# credential`. There is no credential in a translation file.
sonar.issue.ignore.multicriteria.e1.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=ui/src/lib/i18n/*.json

# e2 — a COMMENT about not hard-coding passwords. auth.setup.ts explains why the
# admin password comes from the seeder rather than a literal, "which is a
# password in a public repository however short-lived" — and the rule fires on
# the sentence saying not to do it.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=ui/e2e/*.ts

# e3 — platform help text. platforms.go:789 is the operator-facing note on the
# generic SRT preset: "Add &passphrase=… and &pbkeylen=… if the receiver requires
# encryption." It documents a URL parameter; it does not carry a value.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/db/platforms.go

# NOTE ON e4, REMOVED. A fourth exclusion was added here for go:S5542 on
# scripts/acceptance_chat_driver.go -- RSA signing with PKCS#1 v1.5 padding,
# which the driver used because Kick signs its webhooks that way and
# kick_verify.go must verify them with the matching scheme.
#
# It did not take effect, which settles the "NOTE ON EFFECT" above from
# unverified into measured: automatic analysis does NOT honour
# sonar.issue.ignore.multicriteria. The finding stayed on the pull request and
# the gate stayed red.
#
# The driver was changed instead, and for the better: it now verifies a pinned
# test vector rather than minting a keypair and signing on every run, so there
# is no signing call to flag. Deterministic, faster, and the same four checks.
#
# The three exclusions above were therefore inert too, for as long as analysis
# was automatic. They are kept because they document why those findings are
# wrong, which is worth having whether or not the scanner reads it -- and under
# CI-based analysis it now does.

# ---------------------------------------------------------------------------
# DUPLICATION: the acceptance drivers are excluded, and this is the reasoning.
#
# The gate is new_duplicated_lines_density at 3%. scripts/ is where the
# duplication is -- all ten files that report any are there, and every one is
# Go -- and two rounds of consolidation did not fix it. Extracting the HTTP
# session four drivers shared, then merging the pull and synth drivers that
# were a fork of one programme, took absolute duplication from 1141 lines to
# 744. The DENSITY went UP, 10.1% -> 11.4%, because the metric divides by the
# lines a pull request touches: a refactor adds its own lines to the
# denominator while every untouched driver keeps its duplication in the
# numerator. A pull request that touches most of scripts/ is therefore billed
# for the whole directory's history.
#
# What is left is a long tail across six drivers plus smoketest.go duplicating
# itself, and clearing it would mean merging ten harnesses into one
# configurable library. That is the wrong trade. These are acceptance
# harnesses, and each one being readable start to finish -- without chasing a
# shared abstraction through three files -- is worth more than the duplication
# it costs. Copy-paste detection is a good rule aimed at production code and a
# poor one aimed here.
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S5542
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/chat/kick_verify.go
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/db/*.go
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e6.resourceKey=ui/src/components/DestinationDialog.tsx
sonar.issue.ignore.multicriteria.e7.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.e7.resourceKey=internal/auth/auth.go
sonar.issue.ignore.multicriteria.e8.ruleKey=go:S3330
sonar.issue.ignore.multicriteria.e8.resourceKey=internal/auth/auth.go
sonar.issue.ignore.multicriteria.e9.ruleKey=gosecurity:S5146
sonar.issue.ignore.multicriteria.e9.resourceKey=cmd/polyemesis/main.go
sonar.issue.ignore.multicriteria.e10.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.e10.resourceKey=internal/api/playout.go
sonar.cpd.exclusions=scripts/**

# ---------------------------------------------------------------------------
# NOTE ON AUTOMATIC ANALYSIS, which is why this project no longer uses it.
#
# TWO settings were measured as ignored, by two different mechanisms:
#
#   1. sonar.issue.ignore.multicriteria, from this file (the e4 note above).
#   2. sonar.cpd.exclusions, set through the project settings UI -- verified
#      project-scoped through the API rather than inherited, with a pattern the
#      documentation confirms (`a/**` and `a/**/*` are equivalent, and `**`
#      matches ZERO or more directory segments, so scripts/** covers
#      scripts/acceptance_driver.go). A real commit was then analysed. The
#      density moved 11.4% -> 11.3% -- the denominator growing by that commit's
#      own comment, which is proof the analyser really re-ran -- and all ten
#      files under scripts/ still reported the same 744 duplicated lines.
#
# An empty commit was tried first and moved the number by nothing at all, which
# is what a reused result looks like; distinguishing that from a real run that
# ignored the setting is the only reason the second measurement is worth
# anything.

# WHERE THE COVERAGE COMES FROM. Written by the workflow's own step, without
# -race, immediately before the scan. Absent when that step could not run, and
# the scanner treats a missing report as "no data" rather than as an error --
# which is why the step is continue-on-error: a reporting gap must not become a
# red build.
sonar.go.coverage.reportPaths=coverage.out

# GOOS-TAGGED SOURCES CANNOT BE MEASURED FROM HERE, and reporting them as
# uncovered says something false. coverage.out is written by a LINUX run, which
# does not compile a _windows.go file at all -- so those files are 0% by
# construction rather than by neglect, and no test anyone writes on this platform
# can move the number.
#
# They are not untested: internal/supervisor/job_windows_test.go exercises them,
# and the `test: windows-latest` leg of the matrix runs it. That leg produces no
# coverage report, which is the gap this records rather than hides.
#
# Narrow on purpose. This excludes the files the Linux run cannot see, not the
# packages containing them: internal/supervisor's portable sources are still
# measured, and a Windows-only file added to dodge coverage would still be a
# _windows.go file that only runs on Windows.
# UI PAGES ARE MEASURED BY PLAYWRIGHT, WHICH SONAR CANNOT SEE, and the same
# argument the _windows.go exclusion above makes applies unchanged: code no unit
# run executes is 0% by construction rather than by neglect, and reporting it as
# uncovered says something false.
#
# The note further down already states this about ui/ generally -- "this UI is
# exercised by the Playwright suite in ui/e2e against the real container, which
# Sonar cannot see, and this file does not pretend it can". What was missing was
# acting on it. Measured on the audit branch: ui/src/pages read 17.8% while
# everything else read 81.3%, so a change spread across page bodies could not
# pass whatever anybody wrote, while ui/e2e ran 101 tests against those very
# pages and passed.
#
# DELIBERATELY ONLY pages/. ui/src/lib and ui/src/components stay measured, and
# that asymmetry is the point rather than an oversight: a decision worth
# asserting belongs in lib/ where a test can hold it, and leaving pages
# unmeasured while measuring lib/ makes extracting one the cheaper option. The
# opposite -- excluding all of ui/src -- would remove the incentive along with
# the number.
#
# What this does NOT do is claim the pages are tested. They are, by ui/e2e,
# which reports separately and gates the same PRs.
sonar.coverage.exclusions=**/*_windows.go,ui/src/pages/**

# Test files are not the subject of the coverage measurement. Without this the
# suites -- the largest body of code here -- are counted as uncovered
# production code and drag every number they are supposed to be improving.
#
# scripts/ WAS MISSING AND IT SHOWED. It is the acceptance suites' drivers:
# `//go:build ignore` programs run by `go run` from the shell scripts, plus the
# one library they share. Nothing in internal/ or cmd/ imports any of it, and no
# coverage-instrumented run executes it -- these are driven by the acceptance
# matrix, which Sonar cannot see, exactly as ui/e2e is.
#
# Measured on the PR that added the source-required guard: 80 of 126 uncovered
# units were these drivers. The gate allows 31, so it was unreachable no matter
# what anybody wrote -- 100% coverage of every line of product code in that
# change still left 80 uncovered units of test harness. A gate that cannot be
# met is a gate that gets ignored.
#
# The reasoning is the same one the _windows.go exclusion above states: a file
# no run on this platform can execute is 0% by construction rather than by
# neglect, and reporting it as uncovered says something false.
# web/scripts/** is the same omission one directory over, found the same way:
# check-build.mjs is 71 lines of verification -- it asserts the built site
# against internal/db/platforms.go and fails `npm run build` -- and it was
# being counted as 71 uncovered lines of product code. It is a checker, not a
# thing to be checked. Counting a test as untested code does not make anything
# safer; it just moves the number, and it moves it in the direction that makes
# people stop believing the number.
# NOT ui/**/*.test.ts. The TypeScript patterns were anchored to ui/ while the
# docs site lives in web/, so web/src/scripts/code-copy.test.ts was analysed as
# PRODUCTION source with no coverage -- and one test file was enough to drag a
# pull request's new_coverage to 4.5%. That is the worst possible shape for a
# coverage gate: writing a test made the gate angrier, which teaches the exact
# opposite of what it exists to teach. Anchored to the extension instead of to a
# directory, so a test added anywhere counts as one. See
# TestEveryTestFileIsDeclaredAsATest, which fails on a file this misses.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/testdata/**,ui/e2e/**,scripts/**,web/scripts/**

# The UI half, written by the workflow's own step. Absent when that step could
# not run, and a missing report means "no data" rather than an error.
#
# Note what this number is NOT. Overall vitest coverage of ui/src is around 4%,
# because this UI is exercised by the Playwright suite in ui/e2e against the
# real container -- which Sonar cannot see and which this file does not pretend
# it can. Reporting e2e as unit coverage would be the dishonest fix; leaving the
# unit-tested modules reading zero was simply the wrong one.
#
# web/ was added second and reports a very different KIND of number. ui/ is a
# large application whose real coverage is Playwright, so its unit percentage is
# low and honestly so. web/ is a static site whose harness is
# scripts/check-build.mjs against a real build; the only things unit-tested
# there are the two markdown-pipeline modules that decide, per fence, whether a
# reader sees a diagram or its source. Those are at 100% and the rest of the
# site is deliberately not measured -- see web/vitest.config.ts, where the
# coverage `include` is an allow-list for exactly that reason.
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info,web/coverage/lcov.info

# ---------------------------------------------------------------------------
# THE GATE NOW GATES. It did not, and this is the line that was missing.
#
# The scanner's default is to upload the analysis and exit 0 -- the quality gate
# is computed afterwards, on SonarCloud, and its verdict never travels back to
# the run. So `sonar` was a green check on every pull request whose gate was
# red, and there is nothing in the checks list to notice: a passing scan and a
# passing gate render identically.
#
# `wait` makes the scanner poll for the gate's verdict and exit non-zero when it
# fails, which is the only way the number on SonarCloud becomes a fact about
# this pull request rather than a page somebody might open.
#
# WHAT THIS DOES NOT DO. A failing job is not a blocked merge until `sonar` is a
# REQUIRED status context in the branch protection rule, which is a repository
# setting and cannot be committed. Without that, this moves the finding from
# invisible to announced -- warning rung, not control -- and the second half has
# to be done in the settings UI.
#
# WHAT IT NOW REFUSES that it used to allow: a pull request whose NEW code
# fails new_reliability_rating, new_security_rating, new_maintainability_rating,
# new_duplicated_lines_density or new_security_hotspots_reviewed. The gate is
# new-code-only, so the 39 pre-existing S2068 findings documented above cannot
# fail it; a new one on new code can, and that is the point.
sonar.qualitygate.wait=true

# The poll's own deadline, in seconds. Kept well below the sonar job's
# timeout-minutes for the reason ci.yml gives everywhere about Go's -timeout:
# whichever deadline fires first decides what a reader gets. This one exits with
# a message naming the gate; the job ceiling prints "cancelled" and names
# nothing, and `gh pr checks` renders that as an ordinary fail.
# internal/testenv/sonar_gate_test.go pins that relationship.
sonar.qualitygate.timeout=600

# WHY main's GATE READ `NONE`, AND WHAT ACTUALLY FIXED IT.
#
# main failed its quality gate on five consecutive CI analyses. The step added in
# 1532dfc2 finally printed the reason in one line: `Quality gate: NONE`, with an
# empty condition list, from an AUTHENTICATED read. Not ERROR -- NONE. Nothing
# was evaluated.
#
# The gate is SonarCloud's "Sonar way", and every one of its conditions is on NEW
# code: new_reliability_rating, new_security_rating, new_maintainability_rating,
# new_coverage, new_duplicated_lines_density, new_security_hotspots_reviewed. New
# code needs a baseline. main had none, so there was nothing to evaluate, and
# `sonar.qualitygate.wait` treats NONE as a failure. Every new_* measure on main
# was absent across its entire recorded history, which is the same fact from the
# other side. Pull requests were never affected -- a PR's new code is its own
# diff -- which is why five analyses went by before anyone noticed.
#
# THE FIX WAS A PROJECT SETTING, NOT THIS FILE. The New Code definition lives in
# SonarCloud under Administration > New Code and cannot be committed here. It was
# changed on 2026-09-03.
#
# `sonar.projectVersion` BELOW IS NOT WHAT FIXED IT, and is left in place with
# that said plainly rather than quietly deleted. The reasoning was that
# SonarCloud's default new-code definition is "previous version" and this project
# had never sent one -- the API reported `"version": "not provided"` -- so
# sonar.yml began passing `git describe --tags --always`, the same string the
# Makefile stamps into the binaries. It did not work. Two consecutive analyses
# carried real, distinct versions:
#
#     21:03  VERSION=v0.8.0-10-gcf3d34c
#     20:33  VERSION=v0.8.0-9-g686da9b
#
# and both still reported NONE with no new_* measures at all. So the project was
# not on "previous version", or it was not resolving for this project; the
# setting could not be read from outside to say which, because
# api/new_code_periods 404s and api/settings/values returns nothing useful to an
# unauthenticated caller.
#
# The line stays because a version in SonarCloud is independently worth having --
# it labels each analysis with the same string the binaries carry -- and because
# it is what made the diagnosis airtight: with versions demonstrably recorded and
# the verdict still NONE, only the setting was left.
