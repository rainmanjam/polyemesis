# SonarCloud configuration.
#
# This file exists for one reason: rule S2068 ("hard-coded credentials") fires on
# every translated string whose KEY contains the word password, passphrase or
# secret. There are 15 locale files carrying 26 such keys each, and every one of
# them is a UI label -- "Passphrase", "Stream secret", "Show password" -- not a
# credential. The next locale PR would have failed the quality gate on 37 issues
# that are all the same false positive, and the fix for a false positive is to
# say so once rather than to let the gate erode into something nobody reads.
#
# NOTE ON SCOPE. If this project is analysed by SonarCloud's AUTOMATIC ANALYSIS
# rather than by a CI step, some settings here are ignored and the exclusion also
# has to be set in the project's own configuration (Administration > General
# Settings > Analysis Scope). There is no Sonar step in .github/workflows today,
# so verify the gate on the next PR rather than assuming this was enough.

sonar.projectKey=rainmanjam_polyemesis
sonar.organization=rainmanjam

sonar.sources=.
sonar.exclusions=web/node_modules/**,ui/node_modules/**,internal/web/dist/**,**/testdata/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,ui/e2e/**

sonar.go.exclusions=**/vendor/**

# S2068 on translated UI labels. Scoped to the locale files ONLY, so a genuine
# hard-coded credential anywhere else in the codebase is still reported.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=ui/src/lib/i18n/*.json
