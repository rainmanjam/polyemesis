# SonarCloud configuration.
#
# DELIBERATELY MINIMAL. This file does not set sonar.sources, sonar.tests or
# sonar.exclusions. Analysis of this project is AUTOMATIC (there is no Sonar step
# in .github/workflows), it currently works, and overriding what gets analysed
# from here risks changing that for no gain. The only thing here is the one
# decision that needs recording: which S2068 findings are false positives, and
# why each one is.
#
# S2068 is "hard-coded credentials". Measured against the SonarCloud API on
# 2026-08-08, the project has 39 of them and every one is a false positive:
#
#   json:S2068         37   ui/src/lib/i18n/*.json   (nl 13, id 10, tr 6, pt-BR 4, de 3, en 1)
#   typescript:S2068    1   ui/e2e/auth.setup.ts
#   go:S2068            1   internal/db/platforms.go:789
#
# WHAT IS NOT CLAIMED. An earlier version of this file said the next locale PR
# would fail the quality gate on these. There is no evidence for that. The gate
# is new-code-only -- new_reliability_rating, new_security_rating,
# new_maintainability_rating, new_duplicated_lines_density and
# new_security_hotspots_reviewed -- and it passes today with all 39 present. A
# locale PR adding new translated strings would put new S2068 findings on new
# code, which is the case that has not been observed either way.
#
# So the reason for these exclusions is signal, not a broken gate: a security
# rule that reports 39 findings and is wrong about all 39 is a rule nobody reads,
# and a real hard-coded credential would be invisible among them.
#
# SCOPED PER RULE AND PER PATH, never blanket. S2068 stays live everywhere else,
# which is the whole point -- these three paths are excluded because each was
# looked at, not because the rule is inconvenient.
#
# NOTE ON EFFECT. Automatic analysis does not honour every setting a CI-based
# scanner would. Whether these take effect is unverified; if the counts above are
# unchanged on the next analysis, the same exclusions have to be set project-side
# under Administration > General Settings > Analysis Scope.

sonar.projectKey=rainmanjam_polyemesis
sonar.organization=rainmanjam

sonar.issue.ignore.multicriteria=e1,e2,e3

# e1 — translated UI labels. The finding is on the KEY, not a value: a locale
# file pairing "password" with "Wachtwoord" is a button caption, and every one of
# the 37 reads like `"Password" detected here, make sure this is not a hard-coded
# credential`. There is no credential in a translation file.
sonar.issue.ignore.multicriteria.e1.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=ui/src/lib/i18n/*.json

# e2 — a COMMENT about not hard-coding passwords. auth.setup.ts explains why the
# admin password comes from the seeder rather than a literal, "which is a
# password in a public repository however short-lived" — and the rule fires on
# the sentence saying not to do it.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=ui/e2e/*.ts

# e3 — platform help text. platforms.go:789 is the operator-facing note on the
# generic SRT preset: "Add &passphrase=… and &pbkeylen=… if the receiver requires
# encryption." It documents a URL parameter; it does not carry a value.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/db/platforms.go
