# SonarQube Cloud analysis scope.
#
# This project uses AUTOMATIC ANALYSIS -- the SonarCloud GitHub App, not a
# scanner step in CI. That is why this file is `.sonarcloud.properties` and not
# `sonar-project.properties`: the latter is read by the CI scanners only, so
# dropping one in would be silently ignored. It takes effect from the DEFAULT
# BRANCH.
#
# The rule this file follows: exclusions are for code that is not ours or is not
# source. They are NOT the lever for a rule we disagree with -- excluding a file
# to silence one rule also hides every other finding in it, including the ones
# worth having. Disable the rule in the quality profile instead.

sonar.sources=.
sonar.tests=.

# ---------------------------------------------------------------- test code
#
# Go tests sit beside the code they test, so there is no directory to point at
# and the split has to be by pattern. A file must not land in both roles, hence
# the symmetry below: what sonar.exclusions removes from sources is exactly what
# sonar.test.inclusions adds to tests.
#
# Without this, tests are analysed as production source -- 129 of the project's
# cognitive-complexity findings were in *_test.go, where a long table-driven
# test is the normal shape rather than a defect. Classifying them applies the
# test quality profile instead of suppressing them, so assertion and test-
# hygiene rules still run. That is the half worth keeping.
sonar.exclusions=**/*_test.go,ui/e2e/**
sonar.test.inclusions=**/*_test.go,ui/e2e/**

# ------------------------------------------------------------- not a test
#
# capture.spec.ts is a MEDIA-GENERATION TOOL that happens to be written with
# Playwright: it drives a live instance and writes the screenshots and video in
# docs/media/. It asserts nothing because there is nothing for it to assert --
# which is 14 blocker-severity "add at least one assertion" findings against a
# file that is not a test at all.
#
# Excluded rather than annotated because the same confusion has already cost
# something: playwright.config.ts matched it as a spec, so the acceptance suite
# ran it and quietly overwrote the committed screenshots with pictures of an
# offline system. This says once, in one place, that it is not part of the
# test suite.
sonar.test.exclusions=ui/e2e/capture.spec.ts

# Coverage is not uploaded for these and never will be: e2e specs run against a
# container, and Go test files are the tests rather than the thing measured.
sonar.coverage.exclusions=ui/e2e/**,**/*_test.go
sonar.cpd.exclusions=**/*_test.go,scripts/acceptance*.sh

# ---------------------------------------------------------------- NOT excluded
#
# scripts/*.sh carries 497 of the project's ~1,044 findings, nearly all of them
# one rule: prefer [[ over [. It is tempting to exclude the directory and watch
# half the backlog disappear.
#
# Deliberately not done. install.sh is piped into a root shell by whoever
# installs this, and the last four security findings in it were real -- four
# downloads that static analysis could not see were already pinned to HTTPS.
# Excluding the directory to quiet a style rule would have hidden those too. If
# the [[ rule is unwanted, turn off S7688 in the quality profile, where it
# affects that rule and nothing else.
#
# Build output and binary media need no entry: internal/web/dist and ui/dist are
# untracked, and docs/media is not a language Sonar reads.
